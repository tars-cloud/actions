---
name: Cache selection
description: Internal file-only detection and cache policy using the runner Node runtime.
inputs:
  config:
    description: Public action inputs as JSON
    required: true
  context:
    description: Runner and repository context as JSON
    required: true
outputs:
  plan:
    description: Selected caches, paths, keys and policy
  tools:
    description: Selected tools as JSON
  backend:
    description: Selected archive backend
  cachix-mode:
    description: Selected Cachix mode
  reasons:
    description: Selection reasons as JSON
runs:
  using: node24
  main: main.cjs

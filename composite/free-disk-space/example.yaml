---
# Copy this workflow into .github/workflows/.
# Targets the upcoming v1 release; pin its reviewed full commit SHA after publication.
# Consumer commands require the corresponding tools declared in devenv.nix or the selected flake.
name: "Hosted disk cleanup"
"on":
  workflow_dispatch: {}
  pull_request: {}
permissions:
  contents: "read"
jobs:
  # -------------------------------------------------
  # cleanup
  # -------------------------------------------------
  cleanup:
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
    steps:
      - id: "cleanup"
        name: "Remove unused hosted SDKs"
        uses: "tars-cloud/actions/composite/free-disk-space@v1"
        with:
          android: "true"
          dotnet: "true"
          haskell: "false"
          boost: "false"
          swift: "false"

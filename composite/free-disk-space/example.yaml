---
# Copy this workflow into .github/workflows/.
# Targets the upcoming v1 release; pin its reviewed full commit SHA after publication.
# Consumer commands require the corresponding tools declared in devenv.nix or the selected flake.
name: "Hosted Disk Cleanup"
"on":
  workflow_dispatch: {}
  pull_request: {}
permissions:
  contents: "read"
jobs:
  # -------------------------------------------------
  # Disk Cleanup
  # -------------------------------------------------
  cleanup:
    name: Disk Cleanup - ${{ matrix.architecture }}
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    steps:
      - id: "cleanup"
        name: "Remove Unused Hosted SDKs"
        uses: "tars-cloud/actions/composite/free-disk-space@v3"
        with:
          android: "true"
          dotnet: "true"
          haskell: "false"
          boost: "false"
          swift: "false"

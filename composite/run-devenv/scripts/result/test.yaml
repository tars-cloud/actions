---
# yaml-language-server: $schema=../../../../schemas/test.schema.json
version: 1
sources:
  - composite/run-devenv/scripts/result/main.cjs
tests:
  - id: success
    description: Missing files default to an object and structured results never enter logs.
    tools: [tact, node]
    command: [tact, check, run-result, success]
    expect:
      exit: 0
      calls: []

  - id: invalid
    description: Reject malformed, non-object, oversized and unsafe files without publishing or leaking contents.
    tools: [tact, node]
    command: [tact, check, run-result, invalid]
    expect:
      exit: 0
      calls: []

  - id: isolation
    description: Successive invocations cannot reuse results or remove each other's files.
    tools: [tact, node]
    command: [tact, check, run-result, isolation]
    expect:
      exit: 0
      calls: []

  - id: failure
    description: Unsuccessful commands discard partial results and still clean up.
    tools: [tact, node]
    command: [tact, check, run-result, failure]
    expect:
      exit: 0
      calls: []

---
# yaml-language-server: $schema=../../schemas/test.schema.json
version: 1
sources:
  - "composite/run-devenv/scripts/run.sh"
  - "composite/run-devenv/scripts/environment.sh"
  - "composite/run-devenv/scripts/platform.sh"
tests:
  - id: direct-configured-tests
    description:
      Run direct tests through the bootstrap CLI with profile and token configuration without entering an inner shell.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      DEVENV_MODE: test
      CONSUMER_SECRETSPEC_PROFILE: ci
      DEPENDENCY_GITHUB_TOKEN: fixture-read-token
    files:
      devenv.nix: "{}"
      devenv.yaml: "{}"
      devenv.lock: "{}"
    commands:
      devenv:
        - args:
            - --no-tui
            - test
          exit: 0
    expect:
      exit: 0
      calls:
        - command: devenv
          args:
            - --no-tui
            - test
          env:
            SECRETSPEC_PROVIDER: env
            SECRETSPEC_PROFILE: ci
            NIX_CONFIG: "\nextra-access-tokens = github.com=fixture-read-token"

  - id: configured-test-failure
    description: Preserve the configured test failure exit code.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM64
      RUNNER_ENVIRONMENT: self-hosted
      DEVENV_MODE: test
    files:
      devenv.nix: "{}"
      devenv.yaml: "{}"
      devenv.lock: "{}"
    commands:
      devenv:
        - args:
            - --no-tui
            - test
          exit: 7
    expect:
      exit: 7
      calls:
        - command: devenv
          args:
            - --no-tui
            - test

  - id: reject-flake-configured-tests
    description: Require flake consumers to choose a test command from their devShell.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      DEVENV_MODE: test
      ENVIRONMENT_TYPE: flakes
    expect:
      exit: 1
      calls: []

  - id: reject-unknown-mode
    description: Reject unknown execution modes before consumer code runs.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      DEVENV_MODE: unknown
    expect:
      exit: 1
      calls: []

  - id: discard-runner-profile
    description: An impure flake shell cannot inherit the runner's declared package profile.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      ENVIRONMENT_TYPE: flakes
      DEVENV_PROFILE: /runner/outer-profile
      DEVENV_RUN: 'printf "%s\n" "${DEVENV_PROFILE:-unset}"'
    files:
      flake.nix: "{}"
      flake.lock: "{}"
    commands:
      nix:
        - args: &clean-profile-command
            - develop
            - --impure
            - .#default
            - --command
            - bash
            - --noprofile
            - --norc
            - -euo
            - pipefail
            - -c
            - 'printf "%s\n" "${DEVENV_PROFILE:-unset}"'
          exit: 0
          forward: 4
    expect:
      exit: 0
      calls:
        - command: nix
          args: *clean-profile-command
      stdout: "unset\n"

  - id: foreign-single-entry
    description: Validate and execute foreign commands in one shell, preserving failures and results.
    tools:
      - tact
    command:
      - tact
      - check
      - run-environment
    expect:
      exit: 0
      calls: []

  - id: "direct"
    description: "Execute real inner Bash and preserve its result."
    command:
      - "bash"
      - "composite/run-devenv/scripts/run.sh"
    env:
      RUNNER_OS: "Linux"
      RUNNER_ARCH: "X64"
      RUNNER_ENVIRONMENT: "self-hosted"
      ENVIRONMENT_TYPE: "devenv"
      FLAKE_SHELL: ".#named"
      DEVENV_RUN: "printf \"%s\\n\" \"$VALUE\"\nprintf second > result"
      VALUE: "$(touch injected)"
    files:
      devenv.nix: "{}"
      devenv.yaml: "---\ninputs: {}"
      devenv.lock: "{}"
      flake.nix: "{}"
      flake.lock: "{}"
    commands:
      devenv:
        - args:
            - "--no-tui"
            - "shell"
            - "--quiet"
            - "--"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "printf \"%s\\n\" \"$VALUE\"\nprintf second > result"
          exit: 0
          forward: 4
    expect:
      exit: 0
      calls:
        - command: "devenv"
          args:
            - "--no-tui"
            - "shell"
            - "--quiet"
            - "--"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "printf \"%s\\n\" \"$VALUE\"\nprintf second > result"
      files:
        injected: null
        result: "second"
      stdout: "$(touch injected)\n"
  - id: "flake"
    description: "Execute real inner Bash and preserve its result."
    command:
      - "bash"
      - "composite/run-devenv/scripts/run.sh"
    env:
      RUNNER_OS: "Linux"
      RUNNER_ARCH: "X64"
      RUNNER_ENVIRONMENT: "self-hosted"
      ENVIRONMENT_TYPE: "flakes"
      FLAKE_SHELL: ".#named"
      DEVENV_RUN: "printf flake > result"
      VALUE: "$(touch injected)"
    files:
      devenv.nix: "{}"
      devenv.yaml: "---\ninputs: {}"
      devenv.lock: "{}"
      flake.nix: "{}"
      flake.lock: "{}"
    commands:
      nix:
        - args:
            - "develop"
            - "--impure"
            - ".#named"
            - "--command"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "printf flake > result"
          exit: 0
          forward: 4
    expect:
      exit: 0
      calls:
        - command: "nix"
          args:
            - "develop"
            - "--impure"
            - ".#named"
            - "--command"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "printf flake > result"
      files:
        injected: null
        result: "flake"
  - id: "exit-code"
    description: "Execute real inner Bash and preserve its result."
    command:
      - "bash"
      - "composite/run-devenv/scripts/run.sh"
    env:
      RUNNER_OS: "Linux"
      RUNNER_ARCH: "X64"
      RUNNER_ENVIRONMENT: "self-hosted"
      ENVIRONMENT_TYPE: "devenv"
      FLAKE_SHELL: ".#named"
      DEVENV_RUN: "exit 17"
      VALUE: "$(touch injected)"
    files:
      devenv.nix: "{}"
      devenv.yaml: "---\ninputs: {}"
      devenv.lock: "{}"
      flake.nix: "{}"
      flake.lock: "{}"
    commands:
      devenv:
        - args:
            - "--no-tui"
            - "shell"
            - "--quiet"
            - "--"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "exit 17"
          exit: 0
          forward: 4
    expect:
      exit: 17
      calls:
        - command: "devenv"
          args:
            - "--no-tui"
            - "shell"
            - "--quiet"
            - "--"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "exit 17"
      files:
        injected: null
  - id: "strict-pipeline"
    description: "Execute real inner Bash and preserve its result."
    command:
      - "bash"
      - "composite/run-devenv/scripts/run.sh"
    env:
      RUNNER_OS: "Linux"
      RUNNER_ARCH: "X64"
      RUNNER_ENVIRONMENT: "self-hosted"
      ENVIRONMENT_TYPE: "devenv"
      FLAKE_SHELL: ".#named"
      DEVENV_RUN: "false | true"
      VALUE: "$(touch injected)"
    files:
      devenv.nix: "{}"
      devenv.yaml: "---\ninputs: {}"
      devenv.lock: "{}"
      flake.nix: "{}"
      flake.lock: "{}"
    commands:
      devenv:
        - args:
            - "--no-tui"
            - "shell"
            - "--quiet"
            - "--"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "false | true"
          exit: 0
          forward: 4
    expect:
      exit: 1
      calls:
        - command: "devenv"
          args:
            - "--no-tui"
            - "shell"
            - "--quiet"
            - "--"
            - "bash"
            - "--noprofile"
            - "--norc"
            - "-euo"
            - "pipefail"
            - "-c"
            - "false | true"
      files:
        injected: null
  - id: "empty-run"
    description: "Reject missing commands."
    command:
      - "bash"
      - "composite/run-devenv/scripts/run.sh"
    env:
      RUNNER_OS: "Linux"
      RUNNER_ARCH: "X64"
      RUNNER_ENVIRONMENT: "self-hosted"
    expect:
      exit: 1
      calls: []

  - id: nested-native-system
    description: Execute commands in a nested consumer root with explicit system selection.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM64
      RUNNER_ENVIRONMENT: github-hosted
      ENVIRONMENT_SYSTEM: aarch64-linux
      PROJECT_DIRECTORY: nested project
      DEVENV_RUN: printf result > output
    files:
      nested project/devenv.nix: "{}"
      nested project/devenv.yaml: "---\ninputs: {}"
      nested project/devenv.lock: "{}"
    commands:
      devenv:
        - args: &nested-run
            - --no-tui
            - --system
            - aarch64-linux
            - shell
            - --quiet
            - --
            - bash
            - --noprofile
            - --norc
            - -euo
            - pipefail
            - -c
            - printf result > output
          exit: 0
          forward: 6
    expect:
      exit: 0
      calls:
        - command: devenv
          args: *nested-run
          cwd: ${workspace}/nested project
      files:
        nested project/output: result

  - id: direct-result-file
    description: Direct commands inherit the absolute result path while stdout and stderr stay separate.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      DEVENV_RESULT_FILE: ${workspace}/result file.json
      DEVENV_RUN: &write-result |
        printf 'live stdout\n'
        printf 'live stderr\n' >&2
        printf '{"binary_name":"example","ready":true}\n' > "$DEVENV_RESULT_FILE"
    files:
      devenv.nix: "{}"
      devenv.yaml: "---\ninputs: {}"
      devenv.lock: "{}"
    commands:
      devenv:
        - args: &direct-result
            - --no-tui
            - shell
            - --quiet
            - --
            - bash
            - --noprofile
            - --norc
            - -euo
            - pipefail
            - -c
            - *write-result
          exit: 0
          forward: 4
    expect:
      exit: 0
      calls:
        - command: devenv
          args: *direct-result
      stdout: "live stdout\n"
      stderr: "live stderr\n"
      files:
        result file.json: |
          {"binary_name":"example","ready":true}

  - id: flake-partial-result-failure
    description: Flake commands retain their failure code even after writing a partial result.
    command:
      - bash
      - composite/run-devenv/scripts/run.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM64
      RUNNER_ENVIRONMENT: self-hosted
      ENVIRONMENT_TYPE: flakes
      PROJECT_DIRECTORY: nested project
      DEVENV_RESULT_FILE: ${workspace}/result file.json
      DEVENV_RUN: &failed-result |
        printf '{"partial":true}' > "$DEVENV_RESULT_FILE"
        exit 17
    files:
      nested project/flake.nix: "{}"
      nested project/flake.lock: "{}"
    commands:
      nix:
        - args: &flake-result
            - develop
            - --impure
            - .#default
            - --command
            - bash
            - --noprofile
            - --norc
            - -euo
            - pipefail
            - -c
            - *failed-result
          exit: 0
          forward: 4
    expect:
      exit: 17
      calls:
        - command: nix
          args: *flake-result
          cwd: ${workspace}/nested project
      github-output: {}
      files:
        result file.json: '{"partial":true}'

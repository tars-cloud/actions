---
name: run-devenv
description: Execute Bash commands inside the selected consumer devenv environment.
inputs:
  run:
    description: Bash commands to execute in the consumer environment.
    required: true
  system:
    description: Optional x86_64-linux or aarch64-linux execution system; use the same value as setup-devenv.
    default: ""
  type:
    description: "Environment type: devenv or flakes."
    default: devenv
  flake-shell:
    description: Explicit flake devShell selector.
    default: .#default
  working-directory:
    description: Consumer environment root relative to the workspace.
    default: .
  github-token:
    description: Optional token for GitHub dependency access.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - id: run
      name: Run commands in the selected environment
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ENVIRONMENT_TYPE: ${{ inputs.type }}
        ENVIRONMENT_SYSTEM: ${{ inputs.system }}
        FLAKE_SHELL: ${{ inputs.flake-shell }}
        PROJECT_DIRECTORY: ${{ inputs.working-directory }}
        DEPENDENCY_GITHUB_TOKEN: ${{ inputs.github-token }}
        DEVENV_RUN: ${{ inputs.run }}
      run: bash "$ACTION_ROOT/scripts/run.sh"

---
# Copy this workflow into .github/workflows/.
# Structured results require the next minor release after v1.0.0; pin its reviewed SHA after publication.
# Consumer commands require the corresponding tools declared in devenv.nix or the selected flake.
name: "Flake Environment Execution"
"on":
  workflow_dispatch: {}
  pull_request: {}
permissions:
  contents: "read"
jobs:
  # -------------------------------------------------
  # Flake Commands
  # -------------------------------------------------
  test:
    name: Flake Commands - ${{ matrix.architecture }}
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    steps:
      - id: "checkout"
        name: "Check Out the Consumer Project"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - id: "cache"
        name: "Restore Language and Tool Caches"
        uses: "tars-cloud/actions/composite/setup-cache@v3"
        with:
          type: "flakes"
          flake-shell: ".#default"
          working-directory: "."
          system: "${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}"
          cargo-target: "true"

      - id: "environment"
        name: "Prepare the Consumer Environment"
        uses: "tars-cloud/actions/composite/setup-devenv@v3"
        with:
          type: "flakes"
          flake-shell: ".#default"
          working-directory: "."
          system: "${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}"
          github-token: "${{ secrets.DEPENDENCY_GITHUB_TOKEN || github.token }}"

      - id: "test"
        name: "Run Consumer Commands"
        uses: "tars-cloud/actions/composite/run-devenv@v3"
        with:
          type: "flakes"
          flake-shell: ".#default"
          working-directory: "."
          system: "${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}"
          github-token: "${{ secrets.DEPENDENCY_GITHUB_TOKEN || github.token }}"
          run: |
            cargo test --locked
            printf '{"tests_passed":true,"suite":"cargo"}\n' > "$DEVENV_RESULT_FILE"

      - id: result
        name: Read the Structured Command Result
        shell: bash
        env:
          TESTS_PASSED: ${{ fromJSON(steps.test.outputs.result || '{}').tests_passed }}
          SUITE: ${{ fromJSON(steps.test.outputs.result || '{}').suite }}
        run: |
          test "$TESTS_PASSED" = true
          printf 'Passed suite: %s\n' "$SUITE"

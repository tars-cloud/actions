---
name: setup-trivy
description: Validate and report Trivy from the selected devenv environment.
inputs:
  system:
    description: Optional x86_64-linux or aarch64-linux execution system; use the same value as setup-devenv.
    default: ""
  type:
    description: "Environment type: devenv or flakes."
    default: devenv
  flake-shell:
    description: Explicit flake devShell selector.
    default: .#default
  working-directory:
    description: Consumer environment root relative to the workspace.
    default: .
  github-token:
    description: Optional token for GitHub dependency access during shell entry.
    default: ${{ github.token }}
outputs:
  version:
    description: Trivy version from the selected environment.
    value: ${{ steps.trivy.outputs.version }}
runs:
  using: composite
  steps:
    - id: trivy
      name: Validate Trivy in the selected environment
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ENVIRONMENT_TYPE: ${{ inputs.type }}
        FLAKE_SHELL: ${{ inputs.flake-shell }}
        PROJECT_DIRECTORY: ${{ inputs.working-directory }}
        ENVIRONMENT_SYSTEM: ${{ inputs.system }}
        DEPENDENCY_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "$ACTION_ROOT/scripts/trivy.sh"

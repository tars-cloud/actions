---
# Copy this workflow into .github/workflows/.
# Targets the upcoming v1 release; pin its reviewed full commit SHA after publication.
# Consumer commands require the corresponding tools declared in devenv.nix or the selected flake.
name: "Report consumer tests"
"on":
  workflow_dispatch: {}
  pull_request: {}
permissions:
  contents: "read"
jobs:
  # -------------------------------------------------
  # test
  # -------------------------------------------------
  test:
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
    steps:
      - id: "checkout"
        name: "Check out the consumer project"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - id: "environment"
        name: "Prepare the consumer environment"
        uses: "tars-cloud/actions/composite/setup-devenv@v1"

      - id: "test"
        name: "Run consumer commands"
        uses: "tars-cloud/actions/composite/run-devenv@v1"
        with:
          run: "cargo test --locked"

      - id: "report"
        name: "Report pipeline results"
        uses: "tars-cloud/actions/composite/report-status@v1"
        with:
          results: |
            checkout=${{ steps.checkout.outcome }}
            environment=${{ steps.environment.outcome }}
            tests=${{ steps.test.outcome }}
          fail-on-error: "true"
        if: "${{ always() }}"

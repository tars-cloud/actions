---
name: Check Out the Consumer
description: Resolve read-only dependency authentication and check out the consumer without retained Git credentials.
inputs:
  ref:
    description: Checkout revision; empty preserves checkout's event default.
    default: ""
  fetch-depth:
    description: Checkout history depth.
    default: "1"
  lfs:
    description: Fetch Git LFS files.
    default: "false"
  submodules:
    description: false, true or recursive.
    default: "false"
  dependency-owner:
    description: Owner of the dependency App installation.
    default: ${{ github.repository_owner }}
  dependency-repositories:
    description: JSON array of explicitly authorized dependency repository names.
    default: "[]"
  app-id:
    description: Optional read-only dependency App ID.
    default: ""
  app-private-key:
    description: Optional dependency App private key.
    default: ""
  dependency-token:
    description: Optional existing dependency token, withheld on untrusted runs.
    default: ""
  secretspec-profile:
    description: Optional SecretSpec profile override.
    default: ""
outputs:
  trusted:
    description: Whether supplied credentials may be used.
    value: ${{ steps.resolve_context.outputs.trusted }}
  dependency-token:
    description: Masked dependency read credential for subsequent steps in this job; never a workflow output.
    value:
      ${{ steps.create_dependency_token.outputs.token || (steps.resolve_context.outputs.trusted == 'true' &&
      inputs.dependency-token) || github.token }}
runs:
  using: composite
  steps:
    - id: resolve_context
      name: Resolve Consumer Context
      uses: $/composite/setup-consumer/scripts/context
      with:
        dependency-owner: ${{ inputs.dependency-owner }}
        dependency-repositories: ${{ inputs.dependency-repositories }}
        app-id: ${{ inputs.app-id }}
        app-private-key: ${{ inputs.app-private-key }}
        dependency-token: ${{ inputs.dependency-token }}
        secretspec-profile: ${{ inputs.secretspec-profile }}

    - id: create_dependency_token
      name: Create the Dependency Read Token
      if: steps.resolve_context.outputs.app-enabled == 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.dependency-owner }}
        repositories: ${{ steps.resolve_context.outputs.repositories }}
        permission-contents: read

    - id: check_out_repository
      name: Check Out the Consumer Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}
        persist-credentials: false
        token:
          ${{ (steps.resolve_context.outputs.checkout-with-app == 'true' && steps.create_dependency_token.outputs.token)
          || (steps.resolve_context.outputs.trusted == 'true' && inputs.dependency-token) || github.token }}

---
# Copy this workflow into .github/workflows/.
# Targets the upcoming v1 release; pin its reviewed full commit SHA after publication.
# Consumer commands require the corresponding tools declared in devenv.nix or the selected flake.
name: "Nix prerequisite"
"on":
  workflow_dispatch: {}
  pull_request: {}
permissions:
  contents: "read"
jobs:
  # -------------------------------------------------
  # nix
  # -------------------------------------------------
  nix:
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
    steps:
      - id: "nix"
        name: "Ensure Nix is available"
        uses: "tars-cloud/actions/composite/setup-nix@v1"

      - id: "version"
        name: "Report Nix bootstrap"
        shell: "bash"
        env:
          INSTALLED: "${{ steps.nix.outputs.installed }}"
        run: |
          nix --version
          printf "Installed by this action: %s\n" "$INSTALLED"

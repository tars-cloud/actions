---
# yaml-language-server: $schema=../../schemas/test.schema.json
version: 1
sources:
  - composite/setup-nix-cache/scripts/cachix.sh
  - composite/setup-nix-cache/scripts/platform.sh
  - composite/setup-nix-cache/scripts/select.sh
tests:
  - id: reuse-cachix
    description: Reuse an existing Cachix executable.
    command:
      - bash
      - composite/setup-nix-cache/scripts/cachix.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
    commands:
      cachix:
        - args:
            - --version
          exit: 0
    expect:
      exit: 0
      calls:
        - command: cachix
          args:
            - --version
      github-output:
        binary: ${bin}/cachix

  - id: bootstrap-cachix
    description: Expose the installed profile Cachix executable.
    command:
      - bash
      - composite/setup-nix-cache/scripts/cachix.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
    commands:
      nix:
        - args: &id001
            - profile
            - add
            - nixpkgs#cachix
          exit: 0
      cachix:
        - args:
            - --version
          exit: 0
    expect:
      exit: 0
      calls:
        - command: nix
          args: *id001
        - command: cachix
          args:
            - --version
      github-output:
        binary: ${home}/.nix-profile/bin/cachix
      github-path:
        - ${home}/.nix-profile/bin
    command-paths:
      cachix:
        - ${home}/.nix-profile/bin/cachix

  - id: disabled
    description: Missing configuration skips Cachix without prerequisites or project files.
    command: &select
      - bash
      - composite/setup-nix-cache/scripts/select.sh
    expect:
      exit: 0
      calls: []
      stdout: "Cachix: disabled.\n"
      github-output:
        cachix-mode: disabled

  - id: token-without-name
    description: A token alone does not enable Cachix or expose credentials.
    command: *select
    env:
      CACHIX_TOKEN: fixture-secret
    expect:
      exit: 0
      calls: []
      stdout: "Cachix: disabled.\n"
      stderr: ""
      github-output:
        cachix-mode: disabled

  - id: read-only
    description: A name without a token enables read-only access.
    command: *select
    env:
      CACHIX_NAME: public-fixture
      REPOSITORY: example/project
    expect:
      exit: 0
      calls: []
      stdout: "Cachix: read.\n"
      github-output:
        cachix-mode: read

  - id: write
    description: A configured token enables writes on non-PR jobs without exposing it.
    command: *select
    env:
      CACHIX_NAME: public-fixture
      CACHIX_TOKEN: fixture-secret
      REPOSITORY: example/project
    expect:
      exit: 0
      calls: []
      stdout: "Cachix: write.\n"
      stderr: ""
      github-output:
        cachix-mode: write

  - id: same-repository-pr
    description: Same-repository PRs retain write access with case-insensitive repository identity.
    command: *select
    env:
      CACHIX_NAME: public-fixture
      CACHIX_TOKEN: fixture-secret
      REPOSITORY: example/project
      HEAD_REPOSITORY: Example/Project
    expect:
      exit: 0
      calls: []
      stdout: "Cachix: write.\n"
      github-output:
        cachix-mode: write

  - id: fork-pr
    description: Fork identity disables writes even if a caller supplies a token.
    command: *select
    env:
      CACHIX_NAME: public-fixture
      CACHIX_TOKEN: fixture-secret
      REPOSITORY: example/project
      HEAD_REPOSITORY: fork/project
    expect:
      exit: 0
      calls: []
      stdout: "Cachix: read.\n"
      stderr: ""
      github-output:
        cachix-mode: read

  - id: missing-repository
    description: Missing repository identity does not authorize writes.
    command: *select
    env:
      CACHIX_NAME: public-fixture
      CACHIX_TOKEN: fixture-secret
    expect:
      exit: 0
      calls: []
      stdout: "Cachix: read.\n"
      github-output:
        cachix-mode: read

  - id: invalid-name
    description: Invalid names fail without evaluating or logging their contents.
    command: *select
    env:
      CACHIX_NAME: "$(exit 99)"
      CACHIX_TOKEN: fixture-secret
    expect:
      exit: 1
      calls: []
      stdout: "::error::Invalid cachix-name.\n"
      stderr: ""
      github-output: {}

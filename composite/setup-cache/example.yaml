---
# Copy this workflow into .github/workflows/.
# Consumer commands require the corresponding tools declared in devenv.nix or the selected flake.
# Self-hosted S3 runs require ENABLE_SELF_HOSTED_CI and the TARS_CLOUD_S3_* variables and secrets shown below.
name: "Language Caches"
"on":
  workflow_dispatch: {}
  pull_request: {}
permissions:
  contents: "read"
jobs:
  # -------------------------------------------------
  # GitHub Cache
  # -------------------------------------------------
  hosted:
    name: GitHub Cache - ${{ matrix.architecture }}
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    steps:
      - id: "checkout"
        name: "Check Out the Project"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - id: "cache"
        name: "Restore Language and Tool Caches"
        uses: "tars-cloud/actions/composite/setup-cache@v4"
        with:
          cargo-target: "true"

      - id: "environment"
        name: "Prepare the Environment"
        uses: "tars-cloud/actions/composite/setup-devenv@v4"

      - id: "test"
        name: "Run Project Commands"
        uses: "tars-cloud/actions/composite/run-devenv@v4"
        with:
          run: "cargo test --locked"

      - id: "cache_result"
        name: "Report Cargo Restoration"
        shell: "bash"
        env:
          RESTORE_STATUS: "${{ steps.cache.outputs.cargo-status }}"
        run: "printf \"Cargo restore: %s\\n\" \"$RESTORE_STATUS\""

  # -------------------------------------------------
  # S3 Cache - Self-Hosted
  # -------------------------------------------------
  self_hosted:
    name: S3 Cache - Self-Hosted
    if: "${{ vars.ENABLE_SELF_HOSTED_CI == 'true' && github.event_name == 'workflow_dispatch' }}"
    runs-on:
      - "self-hosted"
      - "Linux"
      - "X64"
    steps:
      - id: "checkout"
        name: "Check Out the Project"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - id: "cache"
        name: "Restore Language and Tool Caches"
        uses: "tars-cloud/actions/composite/setup-cache@v4"
        with:
          cargo-target: "true"
          s3-endpoint: "${{ vars.TARS_CLOUD_S3_ENDPOINT }}"
          s3-bucket: "${{ vars.TARS_CLOUD_S3_BUCKET }}"
          s3-region: "${{ vars.TARS_CLOUD_S3_REGION }}"
          s3-access-key: "${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}"
          s3-secret-key: "${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}"

      - id: "environment"
        name: "Prepare the Environment"
        uses: "tars-cloud/actions/composite/setup-devenv@v4"

      - id: "test"
        name: "Run Project Commands"
        uses: "tars-cloud/actions/composite/run-devenv@v4"
        with:
          run: "cargo test --locked"

      - id: "cache_result"
        name: "Report Cargo Restoration"
        shell: "bash"
        env:
          RESTORE_STATUS: "${{ steps.cache.outputs.cargo-status }}"
        run: "printf \"Cargo restore: %s\\n\" \"$RESTORE_STATUS\""

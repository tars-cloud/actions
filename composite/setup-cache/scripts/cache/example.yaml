---
# This helper is private; consumers should copy this public setup-cache workflow instead.
# Targets the upcoming v1 release; pin its reviewed full commit SHA after publication.
name: "Public cache action"
"on":
  workflow_dispatch: {}
  pull_request: {}
permissions:
  contents: "read"
jobs:
  # -------------------------------------------------
  # cache
  # -------------------------------------------------
  cache:
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
    steps:
      - id: "checkout"
        name: "Check out the consumer project"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - id: "cache"
        name: "Restore language and tool caches"
        uses: "tars-cloud/actions/composite/setup-cache@v1"
        with:
          cargo-target: "true"

      - id: "environment"
        name: "Prepare the consumer environment"
        uses: "tars-cloud/actions/composite/setup-devenv@v1"

      - id: "test"
        name: "Run consumer commands"
        uses: "tars-cloud/actions/composite/run-devenv@v1"
        with:
          run: "cargo test --locked"

      - id: "cache_result"
        name: "Report Cargo restoration"
        shell: "bash"
        env:
          RESTORE_STATUS: "${{ steps.cache.outputs.cargo-status }}"
        run: "printf \"Cargo restore: %s\\n\" \"$RESTORE_STATUS\""

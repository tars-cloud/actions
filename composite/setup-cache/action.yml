---
name: setup-cache
description: Detect and cache dependency downloads before entering the project environment.
inputs:
  system:
    description: Optional x86_64-linux or aarch64-linux environment system; separates compiled caches under emulation.
    default: ""
  type:
    description: "Environment type: devenv or flakes."
    default: devenv
  flake-shell:
    description: Explicit flake devShell selector.
    default: .#default
  working-directory:
    description: Consumer environment root relative to the workspace.
    default: .
  tools:
    description: auto, none, or comma/space-separated cargo, python, bun, trivy.
    default: auto
  exclude:
    description: Additional discovery exclusions, one glob per line.
    default: ""
  python-manager:
    description: auto, uv or pip.
    default: auto
  cargo-target:
    description: Cache compiled output separately.
    default: "false"
  cargo-build-target:
    description: Target triple discriminator for compiled output.
    default: ""
  cargo-build-variant:
    description: Build feature/profile discriminator for compiled output.
    default: ""
  cargo-environment-key:
    description: Compiled-output discriminator for environment inputs outside discovery, such as external Nix modules.
    default: ""
  cargo-cache-path:
    description: Dedicated cargo cache directory override.
    default: ""
  cargo-target-path:
    description: Dedicated cargo-target cache directory override.
    default: ""
  uv-cache-path:
    description: Dedicated uv cache directory override.
    default: ""
  pip-cache-path:
    description: Dedicated pip cache directory override.
    default: ""
  bun-cache-path:
    description: Dedicated bun cache directory override.
    default: ""
  trivy-cache-path:
    description: Dedicated trivy cache directory override.
    default: ""
  s3-endpoint:
    description: Explicit S3-compatible HTTP(S) endpoint.
    default: ""
  s3-bucket:
    description: Explicit cache bucket.
    default: ""
  s3-region:
    description: Explicit signing region; no implicit region default.
    default: ""
  s3-access-key:
    description: Cache-only access key.
    default: ""
  s3-secret-key:
    description: Cache-only secret key.
    default: ""
  s3-session-token:
    description: Optional temporary credential session token.
    default: ""
  s3-force-path-style:
    description: Use path-style S3 addressing.
    default: "true"
outputs:
  tools:
    description: Selected cache tools as JSON.
    value: ${{ steps.selection.outputs.tools }}
  backend:
    description: Selected archive backend.
    value: ${{ steps.selection.outputs.backend }}
  reasons:
    description: Selection explanations as JSON.
    value: ${{ steps.selection.outputs.reasons }}
  cargo-hit:
    description: Exact cargo hit; empty when disabled.
    value: ${{ steps.cargo.outputs.cache-hit }}
  cargo-target-hit:
    description: Exact cargo-target hit; empty when disabled.
    value: ${{ steps.cargo-target.outputs.cache-hit }}
  uv-hit:
    description: Exact uv hit; empty when disabled.
    value: ${{ steps.uv.outputs.cache-hit }}
  pip-hit:
    description: Exact pip hit; empty when disabled.
    value: ${{ steps.pip.outputs.cache-hit }}
  bun-hit:
    description: Exact bun hit; empty when disabled.
    value: ${{ steps.bun.outputs.cache-hit }}
  trivy-hit:
    description: Exact trivy hit; empty when disabled.
    value: ${{ steps.trivy.outputs.cache-hit }}
  cargo-status:
    description: Cargo restore status; empty when disabled.
    value: ${{ steps.cargo.outputs.cache-status }}
  cargo-target-status:
    description: Compiled Cargo restore status; empty when disabled.
    value: ${{ steps.cargo-target.outputs.cache-status }}
  uv-status:
    description: uv restore status; empty when disabled.
    value: ${{ steps.uv.outputs.cache-status }}
  pip-status:
    description: pip restore status; empty when disabled.
    value: ${{ steps.pip.outputs.cache-status }}
  bun-status:
    description: Bun restore status; empty when disabled.
    value: ${{ steps.bun.outputs.cache-status }}
  trivy-status:
    description: Trivy restore status; empty when disabled.
    value: ${{ steps.trivy.outputs.cache-status }}
runs:
  using: composite
  steps:
    - id: selection
      name: Select cache backend and paths
      uses: $/composite/setup-cache/scripts/cache-plan
      with:
        config: ${{ toJSON(inputs) }}
        context:
          '{"runner":${{ toJSON(runner.environment) }},"os":${{ toJSON(runner.os) }},"arch":${{ toJSON(runner.arch)
          }},"workspace":${{ toJSON(github.workspace) }},"repository":${{ toJSON(github.repository) }},"ref":${{
          toJSON(github.ref) }},"defaultBranch":${{ toJSON(github.event.repository.default_branch)
          }},"headRepository":${{ toJSON(github.event.pull_request.head.repo.full_name) }},"pr":${{
          toJSON(github.event.pull_request.number) }}}'

    - id: nix
      name: Ensure Nix is available
      uses: $/composite/setup-nix

    - id: cargo
      name: Restore cargo cache
      if: fromJSON(steps.selection.outputs.plan).caches['cargo'] != null
      uses: $/composite/setup-cache/scripts/cache
      with:
        backend: ${{ fromJSON(steps.selection.outputs.plan).backend }}
        path: ${{ fromJSON(steps.selection.outputs.plan).caches['cargo'].path }}
        key: ${{ fromJSON(steps.selection.outputs.plan).caches['cargo'].key }}
        restore-keys: ${{ fromJSON(steps.selection.outputs.plan).caches['cargo'].restore }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-access-key: ${{ inputs.s3-access-key }}
        s3-secret-key: ${{ inputs.s3-secret-key }}
        s3-session-token: ${{ inputs.s3-session-token }}
        s3-force-path-style: ${{ inputs.s3-force-path-style }}

    - id: cargo-target
      name: Restore cargo-target cache
      if: fromJSON(steps.selection.outputs.plan).caches['cargo-target'] != null
      uses: $/composite/setup-cache/scripts/cache
      with:
        backend: ${{ fromJSON(steps.selection.outputs.plan).backend }}
        path: ${{ fromJSON(steps.selection.outputs.plan).caches['cargo-target'].path }}
        key: ${{ fromJSON(steps.selection.outputs.plan).caches['cargo-target'].key }}
        restore-keys: ${{ fromJSON(steps.selection.outputs.plan).caches['cargo-target'].restore }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-access-key: ${{ inputs.s3-access-key }}
        s3-secret-key: ${{ inputs.s3-secret-key }}
        s3-session-token: ${{ inputs.s3-session-token }}
        s3-force-path-style: ${{ inputs.s3-force-path-style }}

    - id: uv
      name: Restore uv cache
      if: fromJSON(steps.selection.outputs.plan).caches['uv'] != null
      uses: $/composite/setup-cache/scripts/cache
      with:
        backend: ${{ fromJSON(steps.selection.outputs.plan).backend }}
        path: ${{ fromJSON(steps.selection.outputs.plan).caches['uv'].path }}
        key: ${{ fromJSON(steps.selection.outputs.plan).caches['uv'].key }}
        restore-keys: ${{ fromJSON(steps.selection.outputs.plan).caches['uv'].restore }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-access-key: ${{ inputs.s3-access-key }}
        s3-secret-key: ${{ inputs.s3-secret-key }}
        s3-session-token: ${{ inputs.s3-session-token }}
        s3-force-path-style: ${{ inputs.s3-force-path-style }}

    - id: pip
      name: Restore pip cache
      if: fromJSON(steps.selection.outputs.plan).caches['pip'] != null
      uses: $/composite/setup-cache/scripts/cache
      with:
        backend: ${{ fromJSON(steps.selection.outputs.plan).backend }}
        path: ${{ fromJSON(steps.selection.outputs.plan).caches['pip'].path }}
        key: ${{ fromJSON(steps.selection.outputs.plan).caches['pip'].key }}
        restore-keys: ${{ fromJSON(steps.selection.outputs.plan).caches['pip'].restore }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-access-key: ${{ inputs.s3-access-key }}
        s3-secret-key: ${{ inputs.s3-secret-key }}
        s3-session-token: ${{ inputs.s3-session-token }}
        s3-force-path-style: ${{ inputs.s3-force-path-style }}

    - id: bun
      name: Restore bun cache
      if: fromJSON(steps.selection.outputs.plan).caches['bun'] != null
      uses: $/composite/setup-cache/scripts/cache
      with:
        backend: ${{ fromJSON(steps.selection.outputs.plan).backend }}
        path: ${{ fromJSON(steps.selection.outputs.plan).caches['bun'].path }}
        key: ${{ fromJSON(steps.selection.outputs.plan).caches['bun'].key }}
        restore-keys: ${{ fromJSON(steps.selection.outputs.plan).caches['bun'].restore }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-access-key: ${{ inputs.s3-access-key }}
        s3-secret-key: ${{ inputs.s3-secret-key }}
        s3-session-token: ${{ inputs.s3-session-token }}
        s3-force-path-style: ${{ inputs.s3-force-path-style }}

    - id: trivy
      name: Restore Trivy cache
      if: fromJSON(steps.selection.outputs.plan).caches['trivy'] != null
      uses: $/composite/setup-cache/scripts/cache
      with:
        backend: ${{ fromJSON(steps.selection.outputs.plan).backend }}
        path: ${{ fromJSON(steps.selection.outputs.plan).caches['trivy'].path }}
        key: ${{ fromJSON(steps.selection.outputs.plan).caches['trivy'].key }}
        restore-keys: ${{ fromJSON(steps.selection.outputs.plan).caches['trivy'].restore }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-access-key: ${{ inputs.s3-access-key }}
        s3-secret-key: ${{ inputs.s3-secret-key }}
        s3-session-token: ${{ inputs.s3-session-token }}
        s3-force-path-style: ${{ inputs.s3-force-path-style }}

---
name: setup-devenv
description: Bootstrap devenv when required and warm the selected environment without cache setup.
inputs:
  system:
    description: Optional x86_64-linux or aarch64-linux execution system; defaults to the runner system.
    default: ""
  devenv-installable:
    description: Explicit Nix installable for the native devenv CLI, overriding any installed version in direct mode.
    default: ""
  type:
    description: "Environment type: devenv or flakes."
    default: devenv
  flake-shell:
    description: Explicit flake devShell selector.
    default: .#default
  working-directory:
    description: Consumer environment root relative to the workspace.
    default: .
  warmup:
    description: Enter the project shell with a trivial command.
    default: "true"
  github-token:
    description: Optional token for GitHub dependency access.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - id: validate-runner-platform
      name: Validate runner platform
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: bash "$ACTION_ROOT/scripts/platform.sh"

    - id: nix
      name: Ensure Nix is available
      uses: $/composite/setup-nix
      with:
        github-token: ${{ inputs.github-token }}

    - id: prepare-devenv
      name: Prepare devenv
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ENVIRONMENT_TYPE: ${{ inputs.type }}
        FLAKE_SHELL: ${{ inputs.flake-shell }}
        PROJECT_DIRECTORY: ${{ inputs.working-directory }}
        WARMUP: ${{ inputs.warmup }}
        ENVIRONMENT_SYSTEM: ${{ inputs.system }}
        DEVENV_INSTALLABLE: ${{ inputs.devenv-installable }}
        DEPENDENCY_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "$ACTION_ROOT/scripts/devenv.sh"

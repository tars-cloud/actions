---
# Copy to .github/workflows/devenv-update.yaml
name: Devenv Update
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch: {}
concurrency:
  group: devenv-update
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # -------------------------------------------------
  # Update Devenv Dependencies
  # -------------------------------------------------
  update:
    name: Update Devenv Dependencies
    uses: tars-cloud/actions/.github/workflows/devenv-update.yaml@v4
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

---
name: Devenv Update
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
concurrency:
  group: devenv-update
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # -------------------------------------------------
  # Update Devenv Dependencies
  # -------------------------------------------------
  update:
    name: Update Devenv Dependencies
    uses: tars-cloud/actions/.github/workflows/devenv-update.yml@v2
    secrets:
      app-id: ${{ secrets.UPDATE_APP_ID }}
      app-private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}

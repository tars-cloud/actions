---
# Copy to .github/workflows/release.yaml
name: Rust Release
on:
  push:
    branches:
      - trunk
      - main
      - master
  workflow_dispatch:
    inputs:
      recover-pending:
        description: Retry the pending approved release using this workflow revision.
        type: boolean
        default: false
concurrency:
  group: rust-release
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  # -------------------------------------------------
  # Resolve the Release Candidate
  # -------------------------------------------------
  candidate:
    name: Resolve Release Candidate
    uses: tars-cloud/actions/.github/workflows/rust-release-candidate.yaml@v4
    with:
      commit-sha: ${{ github.sha }}
      recover-pending: ${{ inputs.recover-pending || false }}

  # -------------------------------------------------
  # Maintain the Single Release PR
  # -------------------------------------------------
  prepare:
    name: Prepare Release PR
    needs: candidate
    if: needs.candidate.outputs.prepare-ready == 'true'
    uses: tars-cloud/actions/.github/workflows/rust-release-prepare.yaml@v4
    with:
      commit-sha: ${{ github.sha }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # -------------------------------------------------
  # Declare the Release Deliverables
  # -------------------------------------------------
  artifacts:
    name: Describe Release Artifacts
    needs: candidate
    if: needs.candidate.outputs.release-ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      # This example intentionally releases no files.
      # Add project build jobs, upload their artifacts, and list their required files here.
      - id: manifest
        name: Write the Explicit Empty Asset Manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.candidate.outputs.commit-sha }}
        run: |
          printf '{"schema":1,"version":"%s","tag":"%s","commit_sha":"%s","assets":[],"reference_artifacts":[]}\n' \
            "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT" > release-manifest.json

      - id: upload
        name: Upload the Release Manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # -------------------------------------------------
  # Publish After Every Required Job Succeeds
  # -------------------------------------------------
  publish:
    name: Publish Rust Release
    needs: # Include every required project build job.
      - candidate
      - artifacts
    if: needs.candidate.outputs.release-ready == 'true'
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: tars-cloud/actions/.github/workflows/rust-release-publish.yaml@v4
    with:
      commit-sha: ${{ needs.candidate.outputs.commit-sha }}
      recovery: ${{ needs.candidate.outputs.recovery == 'true' }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # -------------------------------------------------
  # Resume Preparation After Recovery
  # -------------------------------------------------
  resume:
    name: Prepare Next Release After Recovery
    needs:
      - candidate
      - publish
    if: needs.candidate.outputs.recovery == 'true'
    uses: tars-cloud/actions/.github/workflows/rust-release-prepare.yaml@v4
    with:
      commit-sha: ${{ github.sha }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

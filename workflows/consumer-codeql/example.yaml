---
name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/consumer-codeql.yaml@v3 # Replace with a published release SHA.
    with:
      type: devenv
      timeout-minutes: 180
      languages: '["actions", "rust"]'
      # Set these to true only for Linux builds that do not need the selected SDKs.
      cleanup-android: false
      cleanup-dotnet: false
      cleanup-haskell: false
      cleanup-boost: false
      cleanup-swift: false
      config-file: auto

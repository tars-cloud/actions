---
# Copy to .github/workflows/codeql.yaml
name: CodeQL
on:
  push:
    branches:
      - trunk
      - main
      - master
  pull_request:
    branches:
      - trunk
      - main
      - master
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/codeql.yaml@v4
    with:
      type: devenv
      languages: '["actions", "rust"]'
    secrets:
      TARS_CLOUD_S3_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}
      TARS_CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}

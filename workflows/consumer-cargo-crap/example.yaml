---
name: "Consumer: Cargo CRAP"
on:
  pull_request:
    branches:
      - trunk
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - trunk
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  # -------------------------------------------------
  # Cargo CRAP
  # -------------------------------------------------
  cargo-crap:
    name: Cargo CRAP
    uses: tars-cloud/actions/.github/workflows/consumer-cargo-crap.yaml@v3
    with:
      debug: false
      baseline-branch: trunk
      coverage-tool: llvm-cov
      llvm-profile-merge-failure-mode: any
      strict-bootstrap: false
      # Opt in only when consumer builds do not need these SDKs.
      cleanup-android: false
      cleanup-dotnet: false
      cleanup-haskell: false
      cleanup-boost: false
      cleanup-swift: false
      post-comment: true
      update-records-pr: true
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

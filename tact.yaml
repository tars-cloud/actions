---
# yaml-language-server: $schema=schemas/tact.schema.json
version: 1
mirrors:
  retention-days: 3
  packages:
    - name: trivy-db
      kind: oci
      destination: ghcr.io/tars-cloud/actions/trivy-db
      tags:
        - "2"
        - daily
      sources:
        - ghcr.io/aquasecurity/trivy-db:2
        - docker.io/aquasec/trivy-db:2
        - public.ecr.aws/aquasecurity/trivy-db:2

    - name: trivy-java-db
      kind: oci
      destination: ghcr.io/tars-cloud/actions/trivy-java-db
      tags:
        - "1"
        - daily
      sources:
        - ghcr.io/aquasecurity/trivy-java-db:1
        - docker.io/aquasec/trivy-java-db:1
        - public.ecr.aws/aquasecurity/trivy-java-db:1

    - name: trivy-checks
      kind: oci
      destination: ghcr.io/tars-cloud/actions/trivy-checks
      tags:
        - "2"
        - daily
      sources:
        - ghcr.io/aquasecurity/trivy-checks:2
        - docker.io/aquasec/trivy-checks:2

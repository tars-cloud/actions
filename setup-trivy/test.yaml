---
# yaml-language-server: $schema=../schemas/test.schema.json
version: 1
sources:
  - internal/trivy.sh
  - internal/trivy-in-environment.sh
  - internal/environment.sh
  - internal/platform.sh
tests:
  - id: direct-reject-ambient
    description: Use only Trivy provided by the selected environment.
    command:
      - bash
      - internal/trivy.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      ENVIRONMENT_TYPE: devenv
    commands:
      devenv:
        - args: &id001
            - --no-tui
            - shell
            - --quiet
            - --
            - bash
            - --noprofile
            - --norc
            - -euo
            - pipefail
            - ${workspace}/internal/trivy-in-environment.sh
          exit: 0
          forward: 4
      trivy:
        - args:
            - --version
          exit: 0
          stdout: "Version: 0.99.0

            "
    expect:
      exit: 1
      calls:
        - command: devenv
          args: *id001
      github-output: {}
    files: &id002
      devenv.nix: "{}"
      devenv.yaml: "---

        inputs: {}"
      devenv.lock: "{}"
      flake.nix: "{}"
      flake.lock: "{}"

  - id: direct-declared-trivy
    description: Use only Trivy provided by the selected environment.
    command:
      - bash
      - internal/trivy.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      ENVIRONMENT_TYPE: devenv
    commands:
      devenv:
        - args: *id001
          exit: 0
          forward: 4
          prepend-path:
            - ${workspace}/package/bin
      trivy:
        - args:
            - --version
          exit: 0
          stdout: "Version: 0.99.0

            "
    expect:
      exit: 0
      calls:
        - command: devenv
          args: *id001
        - command: trivy
          args:
            - --version
      github-output:
        version: 0.99.0
    files: *id002
    command-paths:
      trivy:
        - ${bin}/trivy
        - ${workspace}/package/bin/trivy

  - id: flake-reject-ambient
    description: Use only Trivy provided by the selected environment.
    command:
      - bash
      - internal/trivy.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      ENVIRONMENT_TYPE: flakes
    commands:
      nix:
        - args: &id003
            - develop
            - --impure
            - .#default
            - --command
            - bash
            - --noprofile
            - --norc
            - -euo
            - pipefail
            - ${workspace}/internal/trivy-in-environment.sh
          exit: 0
          forward: 4
      trivy:
        - args:
            - --version
          exit: 0
          stdout: "Version: 0.99.0

            "
    expect:
      exit: 1
      calls:
        - command: nix
          args: *id003
      github-output: {}
    files: *id002

  - id: flake-declared-trivy
    description: Use only Trivy provided by the selected environment.
    command:
      - bash
      - internal/trivy.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      ENVIRONMENT_TYPE: flakes
    commands:
      nix:
        - args: *id003
          exit: 0
          forward: 4
          prepend-path:
            - ${workspace}/package/bin
      trivy:
        - args:
            - --version
          exit: 0
          stdout: "Version: 0.99.0

            "
    expect:
      exit: 0
      calls:
        - command: nix
          args: *id003
        - command: trivy
          args:
            - --version
      github-output:
        version: 0.99.0
    files: *id002
    command-paths:
      trivy:
        - ${bin}/trivy
        - ${workspace}/package/bin/trivy

  - id: unsupported-platform
    description: Reject unsupported runners before entering the project environment.
    command:
      - bash
      - internal/trivy.sh
    env:
      RUNNER_OS: macOS
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
    commands: {}
    expect:
      exit: 1
      calls: []
    files: *id002

  - id: unsupported-architecture
    description: Reject unsupported runners before entering the project environment.
    command:
      - bash
      - internal/trivy.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM
      RUNNER_ENVIRONMENT: self-hosted
    commands: {}
    expect:
      exit: 1
      calls: []
    files: *id002

---
# yaml-language-server: $schema=../schemas/test.schema.json
version: 1
sources:
  - internal/cleanup.sh
  - internal/platform.sh
tests:
  - id: skip-self-hosted
    description: Persistent self-hosted runners never run cleanup commands.
    command:
      - bash
      - internal/cleanup.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
      ANDROID: "true"
      DOTNET: "true"
    commands: {}
    expect:
      exit: 0
      calls: []
      github-output:
        cleaned: "false"

  - id: default-sdks
    description: Remove only the explicitly selected hosted SDK paths.
    command:
      - bash
      - internal/cleanup.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: github-hosted
      ANDROID: "true"
      DOTNET: "true"
    commands:
      df:
        - args:
            - -h
            - /
          exit: 0
      sudo:
        - args:
            - rm
            - -rf
            - --
            - /usr/local/lib/android
          exit: 0
        - args:
            - rm
            - -rf
            - --
            - /usr/share/dotnet
          exit: 0
    expect:
      exit: 0
      calls:
        - command: df
          args:
            - -h
            - /
        - command: sudo
          args:
            - rm
            - -rf
            - --
            - /usr/local/lib/android
        - command: sudo
          args:
            - rm
            - -rf
            - --
            - /usr/share/dotnet
        - command: df
          args:
            - -h
            - /
      github-output:
        cleaned: "true"

  - id: optional-sdks
    description: Remove only the explicitly selected hosted SDK paths.
    command:
      - bash
      - internal/cleanup.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: github-hosted
      HASKELL: "true"
      BOOST: "true"
      SWIFT: "true"
    commands:
      df:
        - args:
            - -h
            - /
          exit: 0
      sudo:
        - args:
            - rm
            - -rf
            - --
            - /opt/ghc
          exit: 0
        - args:
            - rm
            - -rf
            - --
            - /usr/local/.ghcup
          exit: 0
        - args:
            - rm
            - -rf
            - --
            - /usr/local/share/boost
          exit: 0
        - args:
            - rm
            - -rf
            - --
            - /usr/share/swift
          exit: 0
    expect:
      exit: 0
      calls:
        - command: df
          args:
            - -h
            - /
        - command: sudo
          args:
            - rm
            - -rf
            - --
            - /opt/ghc
        - command: sudo
          args:
            - rm
            - -rf
            - --
            - /usr/local/.ghcup
        - command: sudo
          args:
            - rm
            - -rf
            - --
            - /usr/local/share/boost
        - command: sudo
          args:
            - rm
            - -rf
            - --
            - /usr/share/swift
        - command: df
          args:
            - -h
            - /
      github-output:
        cleaned: "true"

  - id: nothing-selected
    description: Remove only the explicitly selected hosted SDK paths.
    command:
      - bash
      - internal/cleanup.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: github-hosted
    commands:
      df:
        - args:
            - -h
            - /
          exit: 0
    expect:
      exit: 0
      calls:
        - command: df
          args:
            - -h
            - /
        - command: df
          args:
            - -h
            - /
      github-output:
        cleaned: "true"

  - id: invalid-toggle
    description: Reject invalid cleanup inputs before invoking any command.
    command:
      - bash
      - internal/cleanup.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: github-hosted
      ANDROID: invalid
    commands: {}
    expect:
      exit: 1
      calls: []

  - id: unsupported-platform
    description: Reject invalid cleanup inputs before invoking any command.
    command:
      - bash
      - internal/cleanup.sh
    env:
      RUNNER_OS: macOS
      RUNNER_ARCH: X64
      RUNNER_ENVIRONMENT: self-hosted
    commands: {}
    expect:
      exit: 1
      calls: []

  - id: unsupported-architecture
    description: Reject invalid cleanup inputs before invoking any command.
    command:
      - bash
      - internal/cleanup.sh
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM
      RUNNER_ENVIRONMENT: self-hosted
    commands: {}
    expect:
      exit: 1
      calls: []

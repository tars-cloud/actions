[workspace]
members = ["crates/tact", "crates/actions-release", "crates/actions-crap", "tests/fixtures/cargo-crap"]
resolver = "3"

[workspace.package]
version = "3.13.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
cargo-crap = "=0.9.0"
clap = { version = "4.6", features = ["derive"] }
jsonschema = { version = "0.59", default-features = false }
nix = { version = "0.31", features = ["signal", "process"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
tempfile = "3.27"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"

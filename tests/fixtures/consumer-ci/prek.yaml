---
repos:
  - repo: local
    hooks:
      - id: check-profile
        name: Check Consumer Profile
        entry:
          bash -c 'test "$SECRETSPEC_PROFILE" = ci && test -w "$PREK_HOME" && test -z "${CONSUMER_AMBIENT_SENTINEL:-}"'
        language: system
        always_run: true
        pass_filenames: false

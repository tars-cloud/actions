---
name: "Repository: SecOps"
on:
  pull_request:
    branches:
      - trunk
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - trunk
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: repository-secops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # -------------------------------------------------
  # Trivy
  # -------------------------------------------------
  trivy:
    name: Trivy
    uses: ./.github/workflows/consumer-trivy.yaml
    with:
      type: devenv
      # Enable after the initial packages are public.
      use-database-mirrors: false
      config-file: trivy.yaml
      gate-config-file: .github/trivy/gate.yaml
      timeout-minutes: 90
      sarif-category: repository-trivy
    secrets:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}

  # -------------------------------------------------
  # CodeQL
  # -------------------------------------------------
  codeql:
    name: CodeQL
    uses: ./.github/workflows/consumer-codeql.yaml
    with:
      type: devenv
      languages: '["actions", "rust", "javascript-typescript"]'
      timeout-minutes: 180
    secrets:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}

---
name: "Repository: Prepare Release"
"on":
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: repository-release
  cancel-in-progress: false
  queue: max

env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: prepare-release

jobs:
  # -------------------------------------------------
  # Prepare Release PR
  # -------------------------------------------------
  prepare:
    name: Prepare Release PR
    if: github.ref == 'refs/heads/trunk'
    runs-on:
      ${{ fromJSON((vars.TARS_CLOUD_RUNNER_TYPE == 'self-hosted' && (vars.TARS_CLOUD_RUNNER_AMD64 ||
      '["self-hosted","linux","x64"]')) || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - id: validate_runner
        name: Validate Runner Configuration
        shell: bash
        env:
          RUNNER_TYPE: ${{ vars.TARS_CLOUD_RUNNER_TYPE }}
          RUNNER_ARCHITECTURE: AMD64
        run: |
          case "$RUNNER_TYPE" in
            ''|saas|self-hosted) ;;
            *) echo '::error::TARS_CLOUD_RUNNER_TYPE must be empty, saas or self-hosted.'; exit 1 ;;
          esac
          case "$RUNNER_ARCHITECTURE" in
            AMD64|ARM64) ;;
            *) echo '::error::runner-architecture must be AMD64 or ARM64.'; exit 1 ;;
          esac

      - id: checkout
        name: Check Out the Selected Trunk Commit and Release History
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: devenv
        name: Prepare the Release Environment
        uses: ./composite/setup-devenv

      - id: app_token
        name: Mint a Repository-Scoped CI App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID || secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: prepare
        name: Calculate the Version and Open or Refresh the Release PR
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: actions-release prepare

---
name: "Repository: Refresh Database Mirrors"
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-database-mirrors
  cancel-in-progress: false
env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: refresh-database-mirrors
jobs:
  # -------------------------------------------------
  # Refresh Database Mirrors
  # -------------------------------------------------
  refresh:
    name: Refresh Database Mirrors
    if: github.repository == 'tars-cloud/actions' && github.ref == 'refs/heads/trunk'
    runs-on:
      ${{ fromJSON((vars.TARS_CLOUD_RUNNER_TYPE == 'self-hosted' && (vars.TARS_CLOUD_RUNNER_AMD64 ||
      '["self-hosted","linux","x64"]')) || '"ubuntu-24.04"') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - id: validate_runner
        name: Validate Runner Configuration
        shell: bash
        env:
          RUNNER_TYPE: ${{ vars.TARS_CLOUD_RUNNER_TYPE }}
          RUNNER_ARCHITECTURE: AMD64
        run: |
          case "$RUNNER_TYPE" in
            ''|saas|self-hosted) ;;
            *) echo '::error::TARS_CLOUD_RUNNER_TYPE must be empty, saas or self-hosted.'; exit 1 ;;
          esac
          case "$RUNNER_ARCHITECTURE" in
            AMD64|ARM64) ;;
            *) echo '::error::runner-architecture must be AMD64 or ARM64.'; exit 1 ;;
          esac

      - id: check_out_repository
        name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set_up_devenv
        name: Set Up Devenv
        uses: ./composite/setup-devenv

      - id: refresh_mirrors
        name: Refresh Database Mirrors
        uses: ./composite/run-devenv
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          run: |
            umask 077
            auth_directory=$(mktemp -d "$RUNNER_TEMP/tact-mirror-auth-XXXXXXXX")
            trap 'rm -rf -- "$auth_directory"' EXIT
            export TACT_ORAS_CONFIG="$auth_directory/config.json"
            printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" \
              --password-stdin --registry-config "$TACT_ORAS_CONFIG"
            tact mirror

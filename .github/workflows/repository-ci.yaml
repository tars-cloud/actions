---
name: "Repository: CI"
"on":
  pull_request:
    branches-ignore:
      - tact-update-base-*
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: github-actions-ci
defaults:
  run:
    shell: bash
jobs:
  # -------------------------------------------------
  # Cargo CRAP Integration
  # -------------------------------------------------
  cargo-crap:
    name: Cargo CRAP Integration
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/test-cargo-crap.yaml

  # -------------------------------------------------
  # Devenv Update
  # -------------------------------------------------
  devenv-update:
    name: Devenv Update - ${{ matrix.type == 'devenv' && 'Devenv' || 'Flake' }} - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        type:
          - devenv
          - flakes
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-devenv-update.yaml
    with:
      job-name:
        Update Devenv Dependencies - ${{ matrix.type == 'devenv' && 'Devenv' || 'Flake' }} - ${{ matrix.architecture }}
      runs-on: ${{ toJSON(matrix.runner) }}
      type: ${{ matrix.type }}
      working-directory: ${{ matrix.type == 'devenv' && 'tests/fixtures/devenv-update' || 'tests/fixtures/flakes' }}
      flake-shell: .#named
      validation-command: ${{ matrix.type == 'flakes' && 'devenv-flake-test' || '' }}
      dry-run: true

  # -------------------------------------------------
  # Shared Rust Release Candidate
  # -------------------------------------------------
  rust-release-candidate:
    name: Shared Rust Release Candidate - ${{ matrix.architecture }}
    # This repository retains its existing release owner until a separate migration.
    if: >-
      github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: read
      pull-requests: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-rust-release-candidate.yaml
    with:
      job-name: Identify Rust Release Candidate - ${{ matrix.architecture }}
      commit-sha: ${{ github.sha }}
      runs-on: ${{ toJSON(matrix.runner) }}

  # -------------------------------------------------
  # Security Scans
  # -------------------------------------------------
  security:
    name: Security Scans
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/test-security-workflows.yaml

  # -------------------------------------------------
  # Remote Consumer
  # -------------------------------------------------
  consumer:
    name: Remote Consumer - ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    steps:
      - id: check_out_source
        name: Check Out Action Test Tooling Separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action-source
          persist-credentials: false

      - id: check_out_consumer
        name: Check Out Only the Nested Consumer Fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer-checkout
          sparse-checkout: tests/fixtures/flakes
          persist-credentials: false

      - id: set_up_tact_nix
        name: Ensure Nix Is Available for Test Tooling
        uses: ./action-source/composite/setup-nix

      - id: prepare_consumer
        name: Generate Remote Action Calls at This Exact Revision
        working-directory: action-source
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          "$tact_package/bin/tact" ci prepare-consumer

      - id: run_remote_consumer
        name: Run Remote Actions Against the Consumer Checkout
        uses: ./.tars/scratch/consumer-action

      - id: verify_consumer
        name: Verify Consumer Paths and Selected Environment
        working-directory: consumer-checkout/tests/fixtures/flakes
        env:
          BACKEND: ${{ steps.run_remote_consumer.outputs.backend }}
          TOOLS: ${{ steps.run_remote_consumer.outputs.tools }}
          NESTED_RESULT: ${{ fromJSON(steps.run_remote_consumer.outputs.result || '{}').nested }}
        run: |-
          test "$BACKEND" = github
          test "$TOOLS" = '["trivy"]'
          test "$NESTED_RESULT" = true
          test "$TRIVY_CACHE_DIR" = "$PWD/.cache/trivy"
          test ! -d "$GITHUB_WORKSPACE/composite"
          test ! -d "$GITHUB_WORKSPACE/consumer-checkout/composite"
          # shellcheck disable=SC2016
          nix develop --impure .#named --command bash --noprofile --norc -euo pipefail -c 'test "$FIXTURE_SHELL" = named; devenv-flake-test'

  # -------------------------------------------------
  # Devenv
  # -------------------------------------------------
  direct:
    name: Devenv - ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    steps:
      - id: check_out_repository
        name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: create_report_fixture
        name: Capture an Intentional Failure for the Reporting Test
        shell: bash
        run: |-
          status=0
          (exit 7) || status=$?
          test "$status" -eq 7
          echo 'result=failure' >> "$GITHUB_OUTPUT"

      - id: run_report_smoke
        name: Report Without Project Environment Setup
        if: always()
        uses: ./composite/report-status
        with:
          title: "Reporting test: intentional failure fixture"
          results: |
            checkout=${{ steps.check_out_repository.outcome }}
            fixture=${{ steps.create_report_fixture.outputs.result }}

      - id: verify_report
        name: Verify Reporting Correctly Describes the Intentional Failure
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.run_report_smoke.outputs.result }}
          PASSED: ${{ steps.run_report_smoke.outputs.passed }}
          REPORTING: ${{ steps.run_report_smoke.outputs.reporting-result }}
          PUBLICATION: ${{ steps.run_report_smoke.outputs.publication-result }}
        run: |-
          test "$RESULT" = failure
          test "$PASSED" = false
          test "$REPORTING" = success
          test "$PUBLICATION" = skipped

      - id: free_disk_space
        name: Free Hosted Runner Disk Space
        uses: ./composite/free-disk-space

      - id: set_up_devenv
        name: Prepare the Selected Environment
        uses: ./composite/setup-devenv

      - id: set_up_nix
        name: Ensure Nix Is Available
        uses: ./composite/setup-nix

      - id: reinstall_devenv
        name: Override the Installed CLI with a Locked Installable
        uses: ./composite/setup-devenv
        with:
          devenv-installable: path:./tests/fixtures/flakes#devenv
          warmup: "false"

      - id: verify_environment_outputs
        name: Verify Native System and Pinned CLI Outputs
        env:
          DEVENV_VERSION: ${{ steps.reinstall_devenv.outputs.devenv-version }}
          SELECTED_SYSTEM: ${{ steps.reinstall_devenv.outputs.system }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
        run: |-
          test "$(devenv --no-tui --version | cut -d ' ' -f 2)" = "$DEVENV_VERSION"
          case "$RUNNER_ARCHITECTURE" in
            X64) test "$SELECTED_SYSTEM" = x86_64-linux ;;
            ARM64) test "$SELECTED_SYSTEM" = aarch64-linux ;;
          esac

      - id: set_up_trivy
        name: Validate Trivy in the Selected Environment
        uses: ./composite/setup-trivy

      - id: validate_repository
        name: Run Unit, Fixture and Static Checks
        uses: ./composite/run-devenv
        with:
          run: |-
            tact validate
            tact run
            tact check metadata
            prek run --all-files
            printf '{"mode":"direct","ok":true}\n' > "$DEVENV_RESULT_FILE"

      - id: run_without_result
        name: Run Without Writing Optional Metadata
        uses: ./composite/run-devenv
        with:
          run: ":"

      - id: skip_result
        name: Leave Result Output Unset When Execution Is Skipped
        if: steps.run_without_result.outputs.result != '{}'
        uses: ./composite/run-devenv
        with:
          run: ":"

      - id: verify_results
        name: Verify Structured and Absent Composite Outputs
        env:
          RESULT_MODE: ${{ fromJSON(steps.validate_repository.outputs.result || '{}').mode }}
          RESULT_OK: ${{ fromJSON(steps.validate_repository.outputs.result || '{}').ok }}
          EMPTY_RESULT: ${{ steps.run_without_result.outputs.result }}
          SKIPPED_RESULT: ${{ fromJSON(steps.skip_result.outputs.result || '{}').missing }}
          SKIPPED_OUTCOME: ${{ steps.skip_result.outcome }}
        run: |-
          test "$RESULT_MODE" = direct
          test "$RESULT_OK" = true
          test "$EMPTY_RESULT" = '{}'
          test -z "$SKIPPED_RESULT"
          test "$SKIPPED_OUTCOME" = skipped

      - id: run_integration_checks
        name: Check Missing Packages and S3 Transport
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        run: |-
          tact integration environments
          tact integration results
          tact integration s3

      - id: run_devenv_tests
        name: Run Devenv Checks
        run: devenv --no-tui test

  # -------------------------------------------------
  # Flake
  # -------------------------------------------------
  flakes:
    name: Flake - ${{ matrix.shell == 'default' && 'Default' || 'Named' }} Shell - ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
        shell:
          - default
          - named
    steps:
      - id: check_out_repository
        name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: restore_cache
        name: Restore Selected Tool Caches
        uses: ./composite/setup-cache
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}
          tools: trivy
          trivy-cache-path: ${{ runner.temp }}/flake-trivy-${{ matrix.shell }}

      - id: set_up_devenv
        name: Prepare the Selected Environment
        uses: ./composite/setup-devenv
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}

      - id: set_up_trivy
        name: Validate Trivy in the Selected Environment
        uses: ./composite/setup-trivy
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}

      - id: verify_shell
        name: Verify Selected Shell
        uses: ./composite/run-devenv
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}
          system: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}
          run: |-
            test "$FIXTURE_SHELL" = "$SELECTED_SHELL"
            test "$FIXTURE_SYSTEM" = "$SELECTED_SYSTEM"
            test "$SETUP_SYSTEM" = "$SELECTED_SYSTEM"
            test -z "$DEVENV_VERSION"
            devenv-flake-test
            printf '{"shell":"%s","system":"%s"}\n' "$FIXTURE_SHELL" "$FIXTURE_SYSTEM" > "$DEVENV_RESULT_FILE"
        env:
          SELECTED_SHELL: ${{ matrix.shell }}
          SETUP_SYSTEM: ${{ steps.set_up_devenv.outputs.system }}
          DEVENV_VERSION: ${{ steps.set_up_devenv.outputs.devenv-version }}
          SELECTED_SYSTEM: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}

      - id: verify_result
        name: Read the Selected Flake Result Through the Public Composite
        env:
          RESULT_SHELL: ${{ fromJSON(steps.verify_shell.outputs.result || '{}').shell }}
          RESULT_SYSTEM: ${{ fromJSON(steps.verify_shell.outputs.result || '{}').system }}
          EXPECTED_SHELL: ${{ matrix.shell }}
          EXPECTED_SYSTEM: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}
        run: |-
          test "$RESULT_SHELL" = "$EXPECTED_SHELL"
          test "$RESULT_SYSTEM" = "$EXPECTED_SYSTEM"

  # -------------------------------------------------
  # GitHub Cache - Cold
  # -------------------------------------------------
  cache-cold:
    name: GitHub Cache - Cold - ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    steps:
      - id: check_out_repository
        name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set_up_tact_nix
        name: Ensure Nix Is Available for Tact
        uses: ./composite/setup-nix

      - id: build_tact
        name: Build Tact from Locked Nix and Cargo Inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare_cache
        name: Prepare Cold Cache Identity
        run: tact ci prepare-cache

      - id: verify_independence
        name: Prove Cache-Only Independence
        run: if command -v devenv; then echo "::error::Expected a runner without devenv"; exit 1; fi

      - id: restore_cache
        name: Restore Selected Tool Caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          cargo-cache-path: ${{ runner.temp }}/tars-cache/cargo
          cargo-target-path: ${{ runner.temp }}/tars-cache/target
          uv-cache-path: ${{ runner.temp }}/tars-cache/uv
          pip-cache-path: ${{ runner.temp }}/tars-cache/pip
          bun-cache-path: ${{ runner.temp }}/tars-cache/bun
          trivy-cache-path: ${{ runner.temp }}/tars-cache/trivy

      - id: set_up_nix
        name: Ensure Nix Is Available
        uses: ./composite/setup-nix

      - id: verify_cache_hits
        name: Check Backend and Exact Hits
        env:
          BACKEND: ${{ steps.restore_cache.outputs.backend }}
          CARGO: ${{ steps.restore_cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.restore_cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.restore_cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.restore_cache.outputs.cargo-target-status }}
          UV: ${{ steps.restore_cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.restore_cache.outputs.uv-status }}
          PIP: ${{ steps.restore_cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.restore_cache.outputs.pip-status }}
          BUN: ${{ steps.restore_cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.restore_cache.outputs.bun-status }}
          TRIVY: ${{ steps.restore_cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.restore_cache.outputs.trivy-status }}
        run: tact ci verify-hits --expected false

      - id: seed_cache
        name: Write Archive Evidence
        run: tact ci seed-cache

  # -------------------------------------------------
  # GitHub Cache - Warm
  # -------------------------------------------------
  cache-warm:
    name: GitHub Cache - Warm - ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    steps:
      - id: check_out_repository
        name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set_up_tact_nix
        name: Ensure Nix Is Available for Tact
        uses: ./composite/setup-nix

      - id: build_tact
        name: Build Tact from Locked Nix and Cargo Inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare_cache
        name: Prepare Cold Cache Identity
        run: tact ci prepare-cache

      - id: verify_independence
        name: Prove Cache-Only Independence
        run: if command -v devenv; then echo "::error::Expected a runner without devenv"; exit 1; fi

      - id: restore_cache
        name: Restore Selected Tool Caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          cargo-cache-path: ${{ runner.temp }}/tars-cache/cargo
          cargo-target-path: ${{ runner.temp }}/tars-cache/target
          uv-cache-path: ${{ runner.temp }}/tars-cache/uv
          pip-cache-path: ${{ runner.temp }}/tars-cache/pip
          bun-cache-path: ${{ runner.temp }}/tars-cache/bun
          trivy-cache-path: ${{ runner.temp }}/tars-cache/trivy

      - id: set_up_nix
        name: Ensure Nix Is Available
        uses: ./composite/setup-nix

      - id: verify_cache_hits
        name: Check Backend and Exact Hits
        env:
          BACKEND: ${{ steps.restore_cache.outputs.backend }}
          CARGO: ${{ steps.restore_cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.restore_cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.restore_cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.restore_cache.outputs.cargo-target-status }}
          UV: ${{ steps.restore_cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.restore_cache.outputs.uv-status }}
          PIP: ${{ steps.restore_cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.restore_cache.outputs.pip-status }}
          BUN: ${{ steps.restore_cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.restore_cache.outputs.bun-status }}
          TRIVY: ${{ steps.restore_cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.restore_cache.outputs.trivy-status }}
        run: tact ci verify-hits --expected true

      - id: verify_cache
        name: Verify Previous Job Post-Save
        run: tact ci verify-cache

    needs: cache-cold

  # -------------------------------------------------
  # S3 Cache - Cold
  # -------------------------------------------------
  s3-cache-cold:
    name: S3 Cache - Cold
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login
      != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: enterprise/tars-cloud
    outputs:
      arch: ${{ steps.select_platform.outputs.arch }}
    timeout-minutes: 60
    steps:
      - id: check_out_repository
        name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: select_platform
        name: Select the Same Architecture for Warm Restoration
        env:
          ARCH: ${{ runner.arch }}
        run: echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - id: set_up_tact_nix
        name: Ensure Nix Is Available for Tact
        uses: ./composite/setup-nix

      - id: build_tact
        name: Build Tact from Locked Nix and Cargo Inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare_cache
        name: Prepare Cold Cache Identity
        run: tact ci prepare-cache --reset-s3-fixture

      - id: restore_cache
        name: Restore Selected Tool Caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}
          s3-region: ${{ secrets.S3_REGION }}
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          cargo-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/cargo
          cargo-target-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/target
          uv-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/uv
          pip-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/pip
          bun-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/bun
          trivy-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/trivy

      - id: set_up_nix
        name: Ensure Nix Is Available
        uses: ./composite/setup-nix

      - id: verify_cache_hits
        name: Check Backend and Exact Hits
        env:
          BACKEND: ${{ steps.restore_cache.outputs.backend }}
          CARGO: ${{ steps.restore_cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.restore_cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.restore_cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.restore_cache.outputs.cargo-target-status }}
          UV: ${{ steps.restore_cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.restore_cache.outputs.uv-status }}
          PIP: ${{ steps.restore_cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.restore_cache.outputs.pip-status }}
          BUN: ${{ steps.restore_cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.restore_cache.outputs.bun-status }}
          TRIVY: ${{ steps.restore_cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.restore_cache.outputs.trivy-status }}
        run: tact ci verify-hits --backend s3 --expected false

      - id: seed_cache
        name: Write Archive Evidence
        run: tact ci seed-cache

  # -------------------------------------------------
  # S3 Cache - Warm
  # -------------------------------------------------
  s3-cache-warm:
    name: S3 Cache - Warm
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login
      != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: enterprise/tars-cloud
      labels: ${{ needs.s3-cache-cold.outputs.arch }}
    timeout-minutes: 60
    steps:
      - id: check_out_repository
        name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set_up_tact_nix
        name: Ensure Nix Is Available for Tact
        uses: ./composite/setup-nix

      - id: build_tact
        name: Build Tact from Locked Nix and Cargo Inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare_cache
        name: Prepare Cold Cache Identity
        run: tact ci prepare-cache --reset-s3-fixture

      - id: restore_cache
        name: Restore Selected Tool Caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}
          s3-region: ${{ secrets.S3_REGION }}
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          cargo-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/cargo
          cargo-target-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/target
          uv-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/uv
          pip-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/pip
          bun-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/bun
          trivy-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/trivy

      - id: set_up_nix
        name: Ensure Nix Is Available
        uses: ./composite/setup-nix

      - id: verify_cache_hits
        name: Check Backend and Exact Hits
        env:
          BACKEND: ${{ steps.restore_cache.outputs.backend }}
          CARGO: ${{ steps.restore_cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.restore_cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.restore_cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.restore_cache.outputs.cargo-target-status }}
          UV: ${{ steps.restore_cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.restore_cache.outputs.uv-status }}
          PIP: ${{ steps.restore_cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.restore_cache.outputs.pip-status }}
          BUN: ${{ steps.restore_cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.restore_cache.outputs.bun-status }}
          TRIVY: ${{ steps.restore_cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.restore_cache.outputs.trivy-status }}
        run: tact ci verify-hits --backend s3 --expected true

      - id: verify_cache
        name: Verify Previous Job Post-Save
        run: tact ci verify-cache

    needs: s3-cache-cold

  # -------------------------------------------------
  # Self-Hosted Validation
  # -------------------------------------------------
  self-hosted:
    name: Self-Hosted Validation
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login
      != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: enterprise/tars-cloud
    timeout-minutes: 60
    steps:
      - id: check_out_repository
        name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: create_report_fixture
        name: Capture an Intentional Failure for the Reporting Test
        shell: bash
        run: |-
          status=0
          (exit 7) || status=$?
          test "$status" -eq 7
          echo 'result=failure' >> "$GITHUB_OUTPUT"

      - id: run_report_smoke
        name: Report Without Project Environment Setup
        if: always()
        uses: ./composite/report-status
        with:
          title: "Reporting test: intentional failure fixture"
          results: |
            checkout=${{ steps.check_out_repository.outcome }}
            fixture=${{ steps.create_report_fixture.outputs.result }}

      - id: verify_report
        name: Verify Reporting Correctly Describes the Intentional Failure
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.run_report_smoke.outputs.result }}
          PASSED: ${{ steps.run_report_smoke.outputs.passed }}
          REPORTING: ${{ steps.run_report_smoke.outputs.reporting-result }}
          PUBLICATION: ${{ steps.run_report_smoke.outputs.publication-result }}
        run: |-
          test "$RESULT" = failure
          test "$PASSED" = false
          test "$REPORTING" = success
          test "$PUBLICATION" = skipped

      - id: restore_cache
        name: Restore Selected Tool Caches
        uses: ./composite/setup-cache
        with:
          tools: trivy
          trivy-cache-path: ${{ runner.temp }}/tars-actions/trivy
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}
          s3-region: ${{ secrets.S3_REGION }}
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - id: verify_backend
        name: Require S3 Storage on the Enterprise Runner
        env:
          BACKEND: ${{ steps.restore_cache.outputs.backend }}
        run: test "$BACKEND" = s3

      - id: set_up_devenv
        name: Prepare the Selected Environment
        uses: ./composite/setup-devenv

      - id: set_up_nix
        name: Ensure Nix Is Available
        uses: ./composite/setup-nix

      - id: set_up_trivy
        name: Validate Trivy in the Selected Environment
        uses: ./composite/setup-trivy

      - id: validate_repository
        name: Validate on the Enterprise Runner
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        run: |-
          tact validate
          tact run
          tact check metadata
          prek run --all-files

      - id: verify_emulation
        name: Validate Preconfigured Foreign-System Execution
        uses: ./composite/run-devenv
        with:
          run: |-
            native=$(nix eval --impure --raw --expr builtins.currentSystem)
            case "$native" in
              x86_64-linux) foreign=aarch64-linux ;;
              aarch64-linux) foreign=x86_64-linux ;;
              *) exit 1 ;;
            esac
            configuration=$(nix config show)
            while IFS= read -r line; do
              if [[ $line == 'extra-platforms = '* && " ${line#*= } " == *" $foreign "* ]]; then
                tact integration environments --system "$foreign"
                exit 0
              fi
            done <<< "$configuration"
            echo "Runner has no preconfigured $foreign support; emulation integration skipped."

      - id: run_devenv_tests
        name: Run Devenv Checks
        run: devenv --no-tui test

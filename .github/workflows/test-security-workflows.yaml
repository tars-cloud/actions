---
name: "Test: Security Workflows"
on:
  workflow_call:
    inputs:
      debug:
        description: Enable verbose tool logs and phase diagnostics; also enabled by GitHub debug logging.
        type: boolean
        required: false
        default: false
    secrets:
      S3_ENDPOINT:
        required: false
      S3_BUCKET:
        required: false
      S3_REGION:
        required: false
      S3_ACCESS_KEY:
        required: false
      S3_SECRET_ACCESS_KEY:
        required: false
      S3_SESSION_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      debug:
        description: Enable verbose tool logs and phase diagnostics; also enabled by GitHub debug logging.
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: security-tests-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # -------------------------------------------------
  # Trivy - Devenv
  # -------------------------------------------------
  trivy-direct:
    name: Trivy - Devenv - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-trivy.yaml
    secrets: inherit
    with:
      debug: ${{ inputs.debug || false }}
      runner-architecture: ${{ matrix.architecture }}
      job-name: Trivy - Devenv - ${{ matrix.architecture }}
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
      timeout-minutes: 180
      config-file: tests/fixtures/flakes/trivy-report.yaml
      # Bootstrap tests must run before the initial packages exist.
      use-database-mirrors: false
      gate-config-file: tests/fixtures/flakes/trivy-gate.yaml
      scan-path: tests/fixtures/flakes
      sarif-category: trivy-direct-${{ matrix.runner }}

  # -------------------------------------------------
  # Trivy - Flake
  # -------------------------------------------------
  trivy-flakes:
    name: Trivy - Flake - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-trivy.yaml
    secrets: inherit
    with:
      debug: ${{ inputs.debug || false }}
      runner-architecture: ${{ matrix.architecture }}
      job-name: Trivy - Flake - ${{ matrix.architecture }}
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
      type: flakes
      working-directory: tests/fixtures/flakes
      flake-shell: .#named
      sarif-category: trivy-flakes-${{ matrix.runner }}
      # Bootstrap tests must run before the initial packages exist.
      use-database-mirrors: false

  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL - Devenv - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-codeql.yaml
    secrets: inherit
    with:
      debug: ${{ inputs.debug || false }}
      runner-architecture: ${{ matrix.architecture }}
      job-name: CodeQL - Devenv - ${{ matrix.architecture }}
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
      timeout-minutes: 180
      type: devenv
      languages: '["actions", "rust"]'
      upload-sarif: ${{ matrix.architecture == 'AMD64' }}
      setup-command: |
        for tool in cargo rustc; do
          case "$(command -v "$tool")" in
            /nix/store/*) ;;
            *) echo "::error::$tool must come from the consumer environment."; exit 1 ;;
          esac
        done

  # -------------------------------------------------
  # CodeQL - Flake
  # -------------------------------------------------
  codeql-flakes:
    name: CodeQL - Flake - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-codeql.yaml
    secrets: inherit
    with:
      debug: ${{ inputs.debug || false }}
      runner-architecture: ${{ matrix.architecture }}
      job-name: CodeQL - Flake - ${{ matrix.architecture }}
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
      type: flakes
      working-directory: tests/fixtures/flakes
      flake-shell: .#codeql
      languages: '["rust"]'
      upload-sarif: false
      setup-command: |
        test "$FIXTURE_SHELL" = codeql
        for tool in cargo rustc; do
          case "$(command -v "$tool")" in
            /nix/store/*) ;;
            *) echo "::error::$tool must come from the consumer environment."; exit 1 ;;
          esac
        done

  # -------------------------------------------------
  # CodeQL - Runner Compatibility
  # -------------------------------------------------
  codeql-runner:
    name: CodeQL - Runner Compatibility
    uses: ./.github/workflows/consumer-codeql.yaml
    secrets: inherit
    with:
      debug: ${{ inputs.debug || false }}
      job-name: CodeQL - Runner Compatibility
      languages: '["actions"]'
      upload-sarif: false

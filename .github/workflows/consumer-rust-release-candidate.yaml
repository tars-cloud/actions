---
name: "Consumer: Rust Release Candidate"
on:
  workflow_call:
    inputs:
      lfs:
        description: Fetch Git LFS files during consumer checkout.
        type: boolean
        default: false
      secretspec-profile:
        description: Optional SecretSpec profile override.
        type: string
        default: ""
      dependency-owner:
        description: Dependency App installation owner; empty uses the consumer repository owner.
        type: string
        default: ""
      dependency-repositories:
        description: JSON array of named private dependency repositories in the selected owner.
        type: string
        default: "[]"
      job-name:
        description: Display name for the candidate job; distinguish multiple invocations.
        type: string
        default: Identify Rust Release Candidate
      commit-sha:
        description: Full default-branch commit SHA from the triggering push.
        required: true
        type: string
      runs-on:
        description: JSON runner label, label array, or group/labels object.
        type: string
        default: '"ubuntu-24.04"'
      type:
        description: Consumer environment type, devenv or flakes.
        type: string
        default: devenv
      flake-shell:
        description: Flake devShell selector.
        type: string
        default: .#default
      devenv-installable:
        description: Optional pinned native devenv CLI installable.
        type: string
        default: ""
    secrets:
      dependency-app-id:
        description: Optional read-only dependency App ID.
        required: false
      dependency-app-private-key:
        description: Optional dependency App private key, separate from publication credentials.
        required: false
      dependency-token:
        description: Optional existing dependency read token.
        required: false
    outputs:
      prepare-ready:
        description: Whether this commit may refresh the release PR.
        value: ${{ jobs.release.outputs.prepare-ready }}
      release-ready:
        description: Whether this commit is ready for consumer release builds.
        value: ${{ jobs.release.outputs.release-ready }}
      version:
        description: Approved Cargo version.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: Immutable version tag.
        value: ${{ jobs.release.outputs.tag }}
      commit-sha:
        description: Exact approved source commit.
        value: ${{ jobs.release.outputs.commit-sha }}
      pr-number:
        description: Merged release PR number.
        value: ${{ jobs.release.outputs.pr-number }}
      reason:
        description: Explanation when no work is required.
        value: ${{ jobs.release.outputs.reason }}
permissions:
  contents: read
  pull-requests: read
  actions: read
env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: rust-release
defaults:
  run:
    shell: bash
jobs:
  # -------------------------------------------------
  # Identify the Consumer Rust Release Candidate
  # -------------------------------------------------
  release:
    name: ${{ inputs.job-name }}
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    outputs:
      prepare-ready: ${{ steps.release.outputs.prepare-ready }}
      release-ready: ${{ steps.release.outputs.release-ready }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit-sha: ${{ steps.release.outputs.commit-sha }}
      pr-number: ${{ steps.release.outputs.pr-number }}
      reason: ${{ steps.release.outputs.reason }}
    steps:
      - id: trigger
        name: Validate the Default-Branch Release Trigger
        env:
          RELEASE_COMMIT: ${{ inputs.commit-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! $RELEASE_COMMIT =~ ^[a-fA-F0-9]{40}$ ||
            $RELEASE_COMMIT != "$GITHUB_SHA" ||
            $GITHUB_REF != "refs/heads/$DEFAULT_BRANCH" ||
            ($GITHUB_EVENT_NAME != push && $GITHUB_EVENT_NAME != workflow_dispatch) ]]; then
            printf '::error::Run Rust release workflows for the exact default-branch push commit.\n'
            exit 1
          fi

      - id: checkout
        name: Check Out the Exact Consumer Commit and Release History
        uses: $/composite/setup-consumer/scripts/checkout
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0
          lfs: ${{ inputs.lfs }}
          secretspec-profile: ${{ inputs.secretspec-profile }}
          dependency-owner: ${{ inputs.dependency-owner || github.repository_owner }}
          dependency-repositories: ${{ inputs.dependency-repositories }}
          app-id: ${{ secrets.dependency-app-id }}
          app-private-key: ${{ secrets.dependency-app-private-key }}
          dependency-token: ${{ secrets.dependency-token }}

      - id: release
        name: Identify the Rust Release Candidate
        uses: $/composite/release-rust
        with:
          dependency-token: ${{ steps.checkout.outputs.dependency-token }}
          secretspec-profile: ${{ inputs.secretspec-profile }}
          command: candidate
          commit-sha: ${{ inputs.commit-sha }}
          type: ${{ inputs.type }}
          flake-shell: ${{ inputs.flake-shell }}
          devenv-installable: ${{ inputs.devenv-installable }}
          github-token: ${{ github.token }}

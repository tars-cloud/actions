---
name: "Test: Devenv CI"
on:
  workflow_call:
    inputs:
      debug:
        description: Enable verbose tool logs and phase diagnostics; also enabled by GitHub debug logging.
        type: boolean
        required: false
        default: false
    secrets:
      TARS_CLOUD_S3_ACCESS_KEY:
        required: false
      TARS_CLOUD_S3_SECRET_ACCESS_KEY:
        required: false
      TARS_CLOUD_S3_SESSION_TOKEN:
        required: false
      dependency-client-id:
        required: false
      dependency-app-private-key:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  # -------------------------------------------------
  # Native Devenv CI
  # -------------------------------------------------
  native:
    name: Devenv CI - ${{ matrix.type }} - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        type:
          - devenv
          - flakes
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/devenv-ci.yaml
    with:
      debug: true
      runner-architecture: ${{ matrix.architecture }}
      job-name: Devenv CI - ${{ matrix.type }} - ${{ matrix.architecture }}
      type: ${{ matrix.type }}
      working-directory: ${{ matrix.type == 'devenv' && 'tests/fixtures/consumer-ci' || 'tests/fixtures/flakes' }}
      flake-shell: .#named
      lint-command:
        ${{ matrix.type == 'flakes' && 'test "$SECRETSPEC_PROFILE" = ci && test -n "$GITHUB_TOKEN"' || 'prek run
        --all-files --config prek.yaml' }}
      test-command: ${{ matrix.type == 'flakes' && 'devenv-flake-test' || '' }}
      secretspec-profile: ci
      dependency-repositories: '["actions"]'
    secrets: inherit

  # -------------------------------------------------
  # Self-Hosted Devenv CI
  # -------------------------------------------------
  self-hosted:
    name: Devenv CI - Self-Hosted - ${{ matrix.type }}
    if: >-
      vars.TARS_CLOUD_RUNNER_TYPE == 'self-hosted' && github.actor != 'dependabot[bot]' && (github.event_name !=
      'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        type:
          - devenv
          - flakes
    uses: ./.github/workflows/devenv-ci.yaml
    with:
      debug: ${{ inputs.debug || false }}
      job-name: Devenv CI - Self-Hosted - ${{ matrix.type }}
      type: ${{ matrix.type }}
      working-directory: ${{ matrix.type == 'devenv' && 'tests/fixtures/consumer-ci' || 'tests/fixtures/flakes' }}
      flake-shell: .#named
      lint-command:
        ${{ matrix.type == 'flakes' && 'test "$SECRETSPEC_PROFILE" = ci && test -n "$GITHUB_TOKEN"' || 'prek run
        --all-files --config prek.yaml' }}
      test-command: ${{ matrix.type == 'flakes' && 'devenv-flake-test' || '' }}
      secretspec-profile: ci
      cache-tools: none
      dependency-repositories: '["actions"]'
    secrets: inherit

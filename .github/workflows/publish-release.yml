---
name: Publish release
"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [trunk]
  workflow_dispatch:
    inputs:
      commit:
        description: Full merged release commit SHA on trunk, after CI succeeds
        required: true
        type: string

permissions:
  contents: read

env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: publish-release

jobs:
  # -------------------------------------------------
  # Publish the tested repository release
  # -------------------------------------------------
  publish:
    if: >-
      github.ref == 'refs/heads/trunk' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: repository-release
      cancel-in-progress: false
    runs-on:
      group: enterprise/tars-cloud
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - id: checkout
        name: Check out trunk and the complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: devenv
        name: Prepare the release environment
        uses: ./composite/setup-devenv

      - id: publish
        name: Verify the merged release and publish its Cargo version
        if: github.event_name == 'workflow_dispatch'
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: actions-release publish --commit "$RELEASE_COMMIT"

      - id: publish-after-ci
        name: Publish a merged release after its trunk CI succeeds
        if: github.event_name == 'workflow_run'
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: actions-release publish-after-ci

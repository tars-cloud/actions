---
name: Shared Security Workflow Tests
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: security-tests-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # -------------------------------------------------
  # Trivy - Devenv
  # -------------------------------------------------
  trivy-direct:
    name: Trivy - Devenv - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/trivy.yml
    with:
      job-name: Trivy - Devenv - ${{ matrix.architecture }}
      runs-on: ${{ toJSON(matrix.runner) }}
      config-file: tests/fixtures/flakes/trivy.yaml
      scan-path: tests/fixtures/flakes
      sarif-category: trivy-direct-${{ matrix.runner }}

  # -------------------------------------------------
  # Trivy - Flake
  # -------------------------------------------------
  trivy-flakes:
    name: Trivy - Flake - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/trivy.yml
    with:
      job-name: Trivy - Flake - ${{ matrix.architecture }}
      runs-on: ${{ toJSON(matrix.runner) }}
      type: flakes
      working-directory: tests/fixtures/flakes
      flake-shell: .#named
      sarif-category: trivy-flakes-${{ matrix.runner }}

  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: ./.github/workflows/codeql.yml
    with:
      languages: '["actions", "rust"]'

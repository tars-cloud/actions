---
name: Prepare release
"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: repository-release
  cancel-in-progress: false

env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: prepare-release

jobs:
  # -------------------------------------------------
  # Prepare the release pull request
  # -------------------------------------------------
  prepare:
    if: github.ref == 'refs/heads/trunk'
    runs-on:
      group: enterprise/tars-cloud
    timeout-minutes: 60
    steps:
      - id: checkout
        name: Check out the selected trunk commit and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: devenv
        name: Prepare the release environment
        uses: ./setup-devenv

      - id: app_token
        name: Mint a repository-scoped CI App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID || secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: prepare
        name: Calculate the version and open or refresh the release PR
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: actions-release prepare

---
name: Prepare release
"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: repository-release
  cancel-in-progress: false

env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: prepare-release

jobs:
  # -------------------------------------------------
  # Prepare the release pull request
  # -------------------------------------------------
  prepare:
    if: github.ref == 'refs/heads/trunk'
    runs-on:
      group: enterprise/tars-cloud
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: checkout
        name: Check out the selected trunk commit and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: devenv
        name: Prepare the release environment
        uses: ./setup-devenv

      - id: prepare
        name: Calculate the version and open or refresh the release PR
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: actions-release prepare

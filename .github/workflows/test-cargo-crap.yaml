---
name: "Test: Cargo CRAP"
on:
  workflow_call:
    secrets:
      app-id:
        description: GitHub App Client ID for the Trusted Recording Lifecycle Test
        required: false
      app-private-key:
        description: GitHub App Private Key for the Trusted Recording Lifecycle Test
        required: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  # -------------------------------------------------
  # Managed Recording PR Lifecycle
  # -------------------------------------------------
  records:
    name: Cargo CRAP Recording PR Lifecycle
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(vars.TARS_REPORTING_RUNNER || vars.TARS_RUNNER_AMD64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    concurrency:
      group: cargo-crap-lifecycle-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: check_out_repository
        name: Check Out the Revision Under Test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set_up_devenv
        name: Prepare Repository Tooling
        uses: ./composite/setup-devenv

      - id: create_app_token
        name: Mint a Recording Fixture App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - id: verify_recording
        name: Verify One Recording PR Across Source Merges
        env:
          CI: "true"
          GH_TOKEN: ${{ steps.create_app_token.outputs.token }}
        run: devenv --no-tui shell --quiet -- tact ci crap-lifecycle

  # -------------------------------------------------
  # Native Coverage and Comparison
  # -------------------------------------------------
  native:
    name:
      Cargo CRAP - ${{ matrix.type == 'devenv' && 'Devenv' || 'Flake' }} - ${{ matrix.backend }} - ${{
      matrix.architecture }}
    runs-on:
      ${{ fromJSON(((matrix.architecture == 'ARM64' && (vars.TARS_RUNNER_ARM64 || '"ubuntu-24.04-arm"')) ||
      vars.TARS_RUNNER_AMD64) || toJSON(matrix.runner)) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        type:
          - devenv
          - flakes
        backend:
          - llvm-cov
          - tarpaulin
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    env:
      TARS_ACTIONS_ROOT: ${{ github.workspace }}
      CI: "true"
      SECRETSPEC_PROVIDER: env
      SECRETSPEC_REASON: github-actions-ci
    steps:
      - id: check_out_repository
        name: Check Out the Revision Under Test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: set_up_devenv
        name: Prepare Repository Tooling
        uses: ./composite/setup-devenv

      - id: set_up_nested_nix
        name: Verify Nested Nix Setup
        uses: ./composite/setup-nix

      - id: measure_fixture
        name: Verify Public Composite Wiring
        uses: ./composite/cargo-crap
        with:
          operation: measure
          working-directory: tests/fixtures/cargo-crap
          type: ${{ matrix.type }}
          flake-shell: .#named
          coverage-tool: ${{ matrix.backend }}
          features: '["cargo-crap"]'

      - id: verify_measurement
        name: Verify Completed Public Measurement
        env:
          COMPLETE: ${{ steps.measure_fixture.outputs.complete }}
          QUALITY: ${{ steps.measure_fixture.outputs.quality }}
        run: test "$COMPLETE" = true && test "$QUALITY" = pass

      - id: verify_comparison
        name: Verify Native Regression and Baseline Lifecycle
        env:
          BACKEND: ${{ matrix.backend }}
          ENVIRONMENT_TYPE: ${{ matrix.type }}
        run:
          devenv --no-tui shell --quiet -- tact integration cargo-crap --backend "$BACKEND" --environment
          "$ENVIRONMENT_TYPE"

  # -------------------------------------------------
  # Reusable Consumer Interface
  # -------------------------------------------------
  consumer:
    name: Cargo CRAP Consumer - ${{ matrix.architecture }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-cargo-crap.yaml
    with:
      runs-on:
        ${{ ((matrix.architecture == 'ARM64' && (vars.TARS_RUNNER_ARM64 || '"ubuntu-24.04-arm"')) ||
        vars.TARS_RUNNER_AMD64) || toJSON(matrix.runner) }}
      job-name: Cargo CRAP Consumer - ${{ matrix.architecture }}
      analysis-id: test-${{ matrix.architecture }}
      # Wrapper implementation can change this repository's own score; fixtures verify the strict gate.
      epsilon: 1000000
      threshold: 1000000

---
name: "Test: Cargo CRAP"
on:
  workflow_call:
    inputs:
      debug:
        description: Enable verbose tool logs and phase diagnostics; also enabled by GitHub debug logging.
        type: boolean
        required: false
        default: false
    secrets:
      S3_ENDPOINT:
        required: false
      S3_BUCKET:
        required: false
      S3_REGION:
        required: false
      S3_ACCESS_KEY:
        required: false
      S3_SECRET_ACCESS_KEY:
        required: false
      S3_SESSION_TOKEN:
        required: false
      app-id:
        description: GitHub App Client ID for the Trusted Recording Lifecycle Test
        required: false
      app-private-key:
        description: GitHub App Private Key for the Trusted Recording Lifecycle Test
        required: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  # -------------------------------------------------
  # Managed Recording PR Lifecycle
  # -------------------------------------------------
  records:
    name: Cargo CRAP Recording PR Lifecycle
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on:
      ${{ fromJSON((vars.TARS_CLOUD_RUNNER_TYPE == 'self-hosted' && (vars.TARS_CLOUD_RUNNER_AMD64 ||
      '["self-hosted","linux","x64"]')) || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    concurrency:
      group: cargo-crap-lifecycle-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: validate_runner
        name: Validate Runner Configuration
        shell: bash
        env:
          RUNNER_TYPE: ${{ vars.TARS_CLOUD_RUNNER_TYPE }}
          RUNNER_ARCHITECTURE: AMD64
        run: |
          case "$RUNNER_TYPE" in
            ''|saas|self-hosted) ;;
            *) echo '::error::TARS_CLOUD_RUNNER_TYPE must be empty, saas or self-hosted.'; exit 1 ;;
          esac
          case "$RUNNER_ARCHITECTURE" in
            AMD64|ARM64) ;;
            *) echo '::error::runner-architecture must be AMD64 or ARM64.'; exit 1 ;;
          esac

      - id: check_out_repository
        name: Check Out the Revision Under Test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set_up_devenv
        name: Prepare Repository Tooling
        uses: ./composite/setup-devenv
        with:
          debug: ${{ inputs.debug || false }}

      - id: create_app_token
        name: Mint a Recording Fixture App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - id: verify_recording
        name: Verify One Recording PR Across Source Merges
        env:
          TARS_DEVENV_LOGGING: ${{ (inputs.debug || runner.debug == '1') && '--verbose' || '--quiet' }}
          CI: "true"
          GH_TOKEN: ${{ steps.create_app_token.outputs.token }}
        shell: >-
          bash --noprofile --norc -e -o pipefail -c "exec devenv --no-tui shell \"$TARS_DEVENV_LOGGING\" -- bash
          --noprofile --norc -e -o pipefail \"$@\"" tars-devenv {0}
        run: tact ci crap-lifecycle

  # -------------------------------------------------
  # Native Coverage and Comparison
  # -------------------------------------------------
  native:
    name:
      Cargo CRAP - ${{ matrix.type == 'devenv' && 'Devenv' || 'Flake' }} - ${{ matrix.backend }} - ${{
      matrix.architecture }} - ${{ matrix.merge-policy }}
    runs-on:
      ${{ fromJSON((vars.TARS_CLOUD_RUNNER_TYPE == 'self-hosted' && ((matrix.architecture == 'ARM64' &&
      (vars.TARS_CLOUD_RUNNER_ARM64 || '["self-hosted","linux","ARM64"]')) || vars.TARS_CLOUD_RUNNER_AMD64 ||
      '["self-hosted","linux","x64"]')) || (matrix.architecture == 'ARM64' && '"ubuntu-24.04-arm"' || '"ubuntu-24.04"'))
      }}
    # Budget for emulated environment builds, coverage and baseline comparisons.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        type:
          - devenv
          - flakes
        backend:
          - llvm-cov
          - tarpaulin
        merge-policy:
          - any
          - all
        exclude:
          - backend: tarpaulin
            merge-policy: all
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    env:
      TARS_ACTIONS_ROOT: ${{ github.workspace }}
      CI: "true"
      SECRETSPEC_PROVIDER: env
      SECRETSPEC_REASON: github-actions-ci
    steps:
      - id: validate_runner
        name: Validate Runner Configuration
        shell: bash
        env:
          RUNNER_TYPE: ${{ vars.TARS_CLOUD_RUNNER_TYPE }}
          RUNNER_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          case "$RUNNER_TYPE" in
            ''|saas|self-hosted) ;;
            *) echo '::error::TARS_CLOUD_RUNNER_TYPE must be empty, saas or self-hosted.'; exit 1 ;;
          esac
          case "$RUNNER_ARCHITECTURE" in
            AMD64|ARM64) ;;
            *) echo '::error::runner-architecture must be AMD64 or ARM64.'; exit 1 ;;
          esac

      - id: check_out_repository
        name: Check Out the Revision Under Test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: free_disk_space
        name: Free Disk Space
        uses: ./composite/free-disk-space
        with:
          debug: ${{ inputs.debug || false }}
          android: "true"
          dotnet: "true"
          haskell: "true"
          boost: "true"
          swift: "true"

      - id: set_up_devenv
        name: Prepare Repository Tooling
        uses: ./composite/setup-devenv
        with:
          debug: ${{ inputs.debug || false }}

      - id: set_up_nested_nix
        name: Verify Nested Nix Setup
        uses: ./composite/setup-nix
        with:
          debug: ${{ inputs.debug || false }}

      - id: prepare_fixture
        name: Prepare Standalone Consumer Fixture
        shell: >-
          bash --noprofile --norc -e -o pipefail -c "exec devenv --no-tui shell \"$TARS_DEVENV_LOGGING\" -- bash
          --noprofile --norc -e -o pipefail \"$@\"" tars-devenv {0}
        env:
          TARS_DEVENV_LOGGING: ${{ (inputs.debug || runner.debug == '1') && '--verbose' || '--quiet' }}
        run: tact integration cargo-crap-fixture

      - id: measure_fixture
        name: Verify Public Composite Wiring
        uses: ./composite/cargo-crap
        with:
          debug: ${{ inputs.debug || false }}
          operation: measure
          strict-bootstrap: "true"
          system: ${{ matrix.architecture == 'ARM64' && 'aarch64-linux' || 'x86_64-linux' }}
          working-directory: ${{ steps.prepare_fixture.outputs.directory }}
          commit-sha: ${{ steps.prepare_fixture.outputs.commit }}
          packages: '["crap-fixture"]'
          type: ${{ matrix.type }}
          flake-shell: .#named
          coverage-tool: ${{ matrix.backend }}
          llvm-profile-merge-failure-mode: ${{ matrix.merge-policy }}
          features: '["cargo-crap"]'

      - id: verify_measurement
        name: Verify Completed Public Measurement
        env:
          COMPLETE: ${{ steps.measure_fixture.outputs.complete }}
          QUALITY: ${{ steps.measure_fixture.outputs.quality }}
        run: test "$COMPLETE" = true && test "$QUALITY" = pass

      - id: verify_comparison
        name: Verify Native Regression and Baseline Lifecycle
        uses: ./composite/run-devenv
        with:
          debug: ${{ inputs.debug || false }}
          system: ${{ matrix.architecture == 'ARM64' && 'aarch64-linux' || 'x86_64-linux' }}
          run: tact integration cargo-crap --backend "$BACKEND" --environment "$ENVIRONMENT_TYPE"
        env:
          BACKEND: ${{ matrix.backend }}
          ENVIRONMENT_TYPE: ${{ matrix.type }}
          CRAP_LLVM_PROFILE_MERGE_FAILURE_MODE: ${{ matrix.merge-policy }}

  # -------------------------------------------------
  # Reusable Consumer Interface
  # -------------------------------------------------
  consumer:
    name: Cargo CRAP Consumer - ${{ matrix.architecture }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        include:
          - runner: ubuntu-24.04
            architecture: AMD64
          - runner: ubuntu-24.04-arm
            architecture: ARM64
    uses: ./.github/workflows/consumer-cargo-crap.yaml
    secrets: inherit
    with:
      debug: ${{ inputs.debug || false }}
      runner-architecture: ${{ matrix.architecture }}
      job-name: Cargo CRAP Consumer - ${{ matrix.architecture }}
      timeout-minutes: 180
      analysis-id: test-${{ matrix.architecture }}
      # Wrapper implementation can change this repository's own score; fixtures verify the strict gate.
      epsilon: 1000000
      threshold: 1000000
      strict-bootstrap: true
      llvm-profile-merge-failure-mode: all
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true

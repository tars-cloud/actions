---
name: "Repository: Cargo CRAP"
on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      debug:
        description: Enable verbose tool logs and phase diagnostics; also enabled by GitHub debug logging.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group:
    cargo-crap-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------
  # Cargo CRAP
  # -------------------------------------------------
  cargo-crap:
    name: Cargo CRAP
    uses: ./.github/workflows/cargo-crap.yaml
    with:
      debug: ${{ inputs.debug || false }}
      baseline-branch: trunk
      packages: '["actions-crap", "actions-release", "tact"]'
      threshold: 30
      epsilon: 0.01
      post-comment: true
      publish-records: true
    secrets:
      TARS_CLOUD_S3_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}
      TARS_CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}
      TARS_CLOUD_S3_SESSION_TOKEN: ${{ secrets.TARS_CLOUD_S3_SESSION_TOKEN }}

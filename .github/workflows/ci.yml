---
name: CI
"on":
  pull_request: {}
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: github-actions-ci
defaults:
  run:
    shell: bash
jobs:
  # -------------------------------------------------
  # Remote actions with a nested consumer checkout
  # -------------------------------------------------
  consumer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - id: source
        name: Check out action test tooling separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action-source
          persist-credentials: false

      - id: consumer
        name: Check out only the nested consumer fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer-checkout
          sparse-checkout: tests/fixtures/flakes
          persist-credentials: false

      - id: nix-for-tact
        name: Ensure Nix is available for test tooling
        uses: ./action-source/composite/setup-nix

      - id: prepare-consumer
        name: Generate remote action calls at this exact revision
        working-directory: action-source
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          "$tact_package/bin/tact" ci prepare-consumer

      - id: remote
        name: Run remote actions against the consumer checkout
        uses: ./.tars/scratch/consumer-action

      - id: verify-consumer
        name: Verify consumer paths and selected environment
        working-directory: consumer-checkout/tests/fixtures/flakes
        env:
          BACKEND: ${{ steps.remote.outputs.backend }}
          TOOLS: ${{ steps.remote.outputs.tools }}
          CACHIX_MODE: ${{ steps.remote.outputs.cachix-mode }}
          NESTED_RESULT: ${{ fromJSON(steps.remote.outputs.result).nested }}
        run: |-
          test "$BACKEND" = github
          test "$TOOLS" = '["trivy"]'
          test "$CACHIX_MODE" = read
          test "$NESTED_RESULT" = true
          test "$TRIVY_CACHE_DIR" = "$PWD/.cache/trivy"
          test ! -d "$GITHUB_WORKSPACE/composite"
          test ! -d "$GITHUB_WORKSPACE/consumer-checkout/composite"
          # shellcheck disable=SC2016
          nix develop --impure .#named --command bash --noprofile --norc -euo pipefail -c 'test "$FIXTURE_SHELL" = named; devenv-flake-test'

  # -------------------------------------------------
  # Direct devenv validation
  # -------------------------------------------------
  direct:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - id: checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: report-fixture
        name: Capture an intentional failure for the reporting test
        shell: bash
        run: |-
          status=0
          (exit 7) || status=$?
          test "$status" -eq 7
          echo 'result=failure' >> "$GITHUB_OUTPUT"

      - id: report-smoke
        name: Report without project environment setup
        if: always()
        uses: ./composite/report-status
        with:
          title: "Reporting test: intentional failure fixture"
          results: |
            checkout=${{ steps.checkout.outcome }}
            fixture=${{ steps.report-fixture.outputs.result }}

      - id: verify-report
        name: Verify reporting correctly describes the intentional failure
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.report-smoke.outputs.result }}
          PASSED: ${{ steps.report-smoke.outputs.passed }}
          REPORTING: ${{ steps.report-smoke.outputs.reporting-result }}
          PUBLICATION: ${{ steps.report-smoke.outputs.publication-result }}
        run: |-
          test "$RESULT" = failure
          test "$PASSED" = false
          test "$REPORTING" = success
          test "$PUBLICATION" = skipped

      - id: cleanup
        name: Free hosted runner disk space
        uses: ./composite/free-disk-space

      - id: nix-cache-disabled
        name: Skip unconfigured Nix caching before Nix setup
        uses: ./composite/setup-nix-cache

      - id: verify-nix-cache-disabled
        name: Verify disabled Nix caching
        env:
          CACHIX_MODE: ${{ steps.nix-cache-disabled.outputs.cachix-mode }}
        run: test "$CACHIX_MODE" = disabled

      - id: nix-cache
        name: Configure public Cachix reads
        uses: ./composite/setup-nix-cache
        with:
          cachix-name: devenv

      - id: verify-nix-cache
        name: Verify read-only Nix caching
        env:
          CACHIX_MODE: ${{ steps.nix-cache.outputs.cachix-mode }}
        run: test "$CACHIX_MODE" = read

      - id: devenv
        name: Prepare the selected environment
        uses: ./composite/setup-devenv

      - id: nix
        name: Ensure Nix is available
        uses: ./composite/setup-nix

      - id: devenv-again
        name: Override the installed CLI with a locked installable
        uses: ./composite/setup-devenv
        with:
          devenv-installable: path:./tests/fixtures/flakes#devenv
          warmup: "false"

      - id: verify-environment-outputs
        name: Verify native system and pinned CLI outputs
        env:
          DEVENV_VERSION: ${{ steps.devenv-again.outputs.devenv-version }}
          SELECTED_SYSTEM: ${{ steps.devenv-again.outputs.system }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
        run: |-
          test "$(devenv --no-tui --version | cut -d ' ' -f 2)" = "$DEVENV_VERSION"
          case "$RUNNER_ARCHITECTURE" in
            X64) test "$SELECTED_SYSTEM" = x86_64-linux ;;
            ARM64) test "$SELECTED_SYSTEM" = aarch64-linux ;;
          esac

      - id: trivy
        name: Validate Trivy in the selected environment
        uses: ./composite/setup-trivy

      - id: validate
        name: Unit, fixture and static validation
        uses: ./composite/run-devenv
        with:
          run: |-
            tact validate
            tact run
            tact check metadata
            prek run --all-files
            printf '{"mode":"direct","ok":true}\n' > "$DEVENV_RESULT_FILE"

      - id: no-result
        name: Run without writing optional metadata
        uses: ./composite/run-devenv
        with:
          run: ":"

      - id: verify-results
        name: Verify structured and absent composite outputs
        env:
          RESULT_MODE: ${{ fromJSON(steps.validate.outputs.result).mode }}
          RESULT_OK: ${{ fromJSON(steps.validate.outputs.result).ok }}
          EMPTY_RESULT: ${{ steps.no-result.outputs.result }}
        run: |-
          test "$RESULT_MODE" = direct
          test "$RESULT_OK" = true
          test "$EMPTY_RESULT" = '{}'

      - id: integration
        name: Real missing-package and S3 transport checks
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        run: |-
          tact integration environments
          tact integration results
          tact integration s3
          tact integration cachix

      - id: test
        name: Devenv checks
        run: devenv --no-tui test

  # -------------------------------------------------
  # Flake shell validation
  # -------------------------------------------------
  flakes:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        shell:
          - default
          - named
    steps:
      - id: checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: cache
        name: Restore selected tool caches
        uses: ./composite/setup-cache
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}
          tools: trivy
          trivy-cache-path: ${{ runner.temp }}/flake-trivy-${{ matrix.shell }}

      - id: nix-cache
        name: Configure public Cachix reads for the flake
        uses: ./composite/setup-nix-cache
        with:
          cachix-name: devenv

      - id: verify-nix-cache
        name: Verify read-only Nix caching
        env:
          CACHIX_MODE: ${{ steps.nix-cache.outputs.cachix-mode }}
        run: test "$CACHIX_MODE" = read

      - id: devenv
        name: Prepare the selected environment
        uses: ./composite/setup-devenv
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}

      - id: trivy
        name: Validate Trivy in the selected environment
        uses: ./composite/setup-trivy
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}

      - id: verify-shell
        name: Verify selected shell
        uses: ./composite/run-devenv
        with:
          type: flakes
          working-directory: tests/fixtures/flakes
          flake-shell: .#${{ matrix.shell }}
          system: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}
          run: |-
            test "$FIXTURE_SHELL" = "$SELECTED_SHELL"
            test "$FIXTURE_SYSTEM" = "$SELECTED_SYSTEM"
            test "$SETUP_SYSTEM" = "$SELECTED_SYSTEM"
            test -z "$DEVENV_VERSION"
            devenv-flake-test
            printf '{"shell":"%s","system":"%s"}\n' "$FIXTURE_SHELL" "$FIXTURE_SYSTEM" > "$DEVENV_RESULT_FILE"
        env:
          SELECTED_SHELL: ${{ matrix.shell }}
          SETUP_SYSTEM: ${{ steps.devenv.outputs.system }}
          DEVENV_VERSION: ${{ steps.devenv.outputs.devenv-version }}
          SELECTED_SYSTEM: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}

      - id: verify-result
        name: Read the selected flake result through the public composite
        env:
          RESULT_SHELL: ${{ fromJSON(steps.verify-shell.outputs.result).shell }}
          RESULT_SYSTEM: ${{ fromJSON(steps.verify-shell.outputs.result).system }}
          EXPECTED_SHELL: ${{ matrix.shell }}
          EXPECTED_SYSTEM: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64-linux' || 'x86_64-linux' }}
        run: |-
          test "$RESULT_SHELL" = "$EXPECTED_SHELL"
          test "$RESULT_SYSTEM" = "$EXPECTED_SYSTEM"

  # -------------------------------------------------
  # Cold cache validation
  # -------------------------------------------------
  cache-cold:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - id: checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: nix-for-tact
        name: Ensure Nix is available for Tact
        uses: ./composite/setup-nix

      - id: tact
        name: Build Tact from locked Nix and Cargo inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare-cache
        name: Prepare cold cache identity
        run: tact ci prepare-cache

      - id: verify-independence
        name: Prove cache-only independence
        run: if command -v devenv; then echo "::error::Expected a runner without devenv"; exit 1; fi

      - id: cache
        name: Restore selected tool caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          cargo-cache-path: ${{ runner.temp }}/tars-cache/cargo
          cargo-target-path: ${{ runner.temp }}/tars-cache/target
          uv-cache-path: ${{ runner.temp }}/tars-cache/uv
          pip-cache-path: ${{ runner.temp }}/tars-cache/pip
          bun-cache-path: ${{ runner.temp }}/tars-cache/bun
          trivy-cache-path: ${{ runner.temp }}/tars-cache/trivy

      - id: nix
        name: Ensure Nix is available
        uses: ./composite/setup-nix

      - id: verify-hits
        name: Check backend and exact hits
        env:
          BACKEND: ${{ steps.cache.outputs.backend }}
          CARGO: ${{ steps.cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.cache.outputs.cargo-target-status }}
          UV: ${{ steps.cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.cache.outputs.uv-status }}
          PIP: ${{ steps.cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.cache.outputs.pip-status }}
          BUN: ${{ steps.cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.cache.outputs.bun-status }}
          TRIVY: ${{ steps.cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.cache.outputs.trivy-status }}
        run: tact ci verify-hits --expected false

      - id: seed-cache
        name: Write archive evidence
        run: tact ci seed-cache

  # -------------------------------------------------
  # Warm cache validation
  # -------------------------------------------------
  cache-warm:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - id: checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: nix-for-tact
        name: Ensure Nix is available for Tact
        uses: ./composite/setup-nix

      - id: tact
        name: Build Tact from locked Nix and Cargo inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare-cache
        name: Prepare cold cache identity
        run: tact ci prepare-cache

      - id: verify-independence
        name: Prove cache-only independence
        run: if command -v devenv; then echo "::error::Expected a runner without devenv"; exit 1; fi

      - id: cache
        name: Restore selected tool caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          cargo-cache-path: ${{ runner.temp }}/tars-cache/cargo
          cargo-target-path: ${{ runner.temp }}/tars-cache/target
          uv-cache-path: ${{ runner.temp }}/tars-cache/uv
          pip-cache-path: ${{ runner.temp }}/tars-cache/pip
          bun-cache-path: ${{ runner.temp }}/tars-cache/bun
          trivy-cache-path: ${{ runner.temp }}/tars-cache/trivy

      - id: nix
        name: Ensure Nix is available
        uses: ./composite/setup-nix

      - id: verify-hits
        name: Check backend and exact hits
        env:
          BACKEND: ${{ steps.cache.outputs.backend }}
          CARGO: ${{ steps.cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.cache.outputs.cargo-target-status }}
          UV: ${{ steps.cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.cache.outputs.uv-status }}
          PIP: ${{ steps.cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.cache.outputs.pip-status }}
          BUN: ${{ steps.cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.cache.outputs.bun-status }}
          TRIVY: ${{ steps.cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.cache.outputs.trivy-status }}
        run: tact ci verify-hits --expected true

      - id: verify-cache
        name: Verify previous job post-save
        run: tact ci verify-cache

    needs: cache-cold

  # -------------------------------------------------
  # S3 cold cache validation
  # -------------------------------------------------
  s3-cache-cold:
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login
      != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: enterprise/tars-cloud
    outputs:
      arch: ${{ steps.platform.outputs.arch }}
    timeout-minutes: 60
    steps:
      - id: checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: platform
        name: Select the same architecture for warm restoration
        env:
          ARCH: ${{ runner.arch }}
        run: echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - id: nix-for-tact
        name: Ensure Nix is available for Tact
        uses: ./composite/setup-nix

      - id: tact
        name: Build Tact from locked Nix and Cargo inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare-cache
        name: Prepare cold cache identity
        run: tact ci prepare-cache --reset-s3-fixture

      - id: cache
        name: Restore selected tool caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}
          s3-region: ${{ secrets.S3_REGION }}
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          cargo-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/cargo
          cargo-target-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/target
          uv-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/uv
          pip-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/pip
          bun-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/bun
          trivy-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/trivy

      - id: nix
        name: Ensure Nix is available
        uses: ./composite/setup-nix

      - id: verify-hits
        name: Check backend and exact hits
        env:
          BACKEND: ${{ steps.cache.outputs.backend }}
          CARGO: ${{ steps.cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.cache.outputs.cargo-target-status }}
          UV: ${{ steps.cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.cache.outputs.uv-status }}
          PIP: ${{ steps.cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.cache.outputs.pip-status }}
          BUN: ${{ steps.cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.cache.outputs.bun-status }}
          TRIVY: ${{ steps.cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.cache.outputs.trivy-status }}
        run: tact ci verify-hits --backend s3 --expected false

      - id: seed-cache
        name: Write archive evidence
        run: tact ci seed-cache

  # -------------------------------------------------
  # S3 warm cache validation
  # -------------------------------------------------
  s3-cache-warm:
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login
      != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: enterprise/tars-cloud
      labels: ${{ needs.s3-cache-cold.outputs.arch }}
    timeout-minutes: 60
    steps:
      - id: checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: nix-for-tact
        name: Ensure Nix is available for Tact
        uses: ./composite/setup-nix

      - id: tact
        name: Build Tact from locked Nix and Cargo inputs
        run: |-
          tact_package=$(nix-build nix/packages/tact.nix --no-out-link)
          echo "$tact_package/bin" >> "$GITHUB_PATH"

      - id: prepare-cache
        name: Prepare cold cache identity
        run: tact ci prepare-cache --reset-s3-fixture

      - id: cache
        name: Restore selected tool caches
        uses: ./composite/setup-cache
        with:
          working-directory: .tars/scratch/ci-cache
          cargo-target: "true"
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}
          s3-region: ${{ secrets.S3_REGION }}
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          cargo-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/cargo
          cargo-target-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/target
          uv-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/uv
          pip-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/pip
          bun-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/bun
          trivy-cache-path: ${{ runner.temp }}/tact-s3-${{ github.run_id }}-${{ github.run_attempt }}/trivy

      - id: nix
        name: Ensure Nix is available
        uses: ./composite/setup-nix

      - id: verify-hits
        name: Check backend and exact hits
        env:
          BACKEND: ${{ steps.cache.outputs.backend }}
          CARGO: ${{ steps.cache.outputs.cargo-hit }}
          CARGO_STATUS: ${{ steps.cache.outputs.cargo-status }}
          CARGO_TARGET: ${{ steps.cache.outputs.cargo-target-hit }}
          CARGO_TARGET_STATUS: ${{ steps.cache.outputs.cargo-target-status }}
          UV: ${{ steps.cache.outputs.uv-hit }}
          UV_STATUS: ${{ steps.cache.outputs.uv-status }}
          PIP: ${{ steps.cache.outputs.pip-hit }}
          PIP_STATUS: ${{ steps.cache.outputs.pip-status }}
          BUN: ${{ steps.cache.outputs.bun-hit }}
          BUN_STATUS: ${{ steps.cache.outputs.bun-status }}
          TRIVY: ${{ steps.cache.outputs.trivy-hit }}
          TRIVY_STATUS: ${{ steps.cache.outputs.trivy-status }}
        run: tact ci verify-hits --backend s3 --expected true

      - id: verify-cache
        name: Verify previous job post-save
        run: tact ci verify-cache

    needs: s3-cache-cold

  # -------------------------------------------------
  # Enterprise self-hosted validation
  # -------------------------------------------------
  self-hosted:
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login
      != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: enterprise/tars-cloud
    timeout-minutes: 60
    steps:
      - id: checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: report-fixture
        name: Capture an intentional failure for the reporting test
        shell: bash
        run: |-
          status=0
          (exit 7) || status=$?
          test "$status" -eq 7
          echo 'result=failure' >> "$GITHUB_OUTPUT"

      - id: report-smoke
        name: Report without project environment setup
        if: always()
        uses: ./composite/report-status
        with:
          title: "Reporting test: intentional failure fixture"
          results: |
            checkout=${{ steps.checkout.outcome }}
            fixture=${{ steps.report-fixture.outputs.result }}

      - id: verify-report
        name: Verify reporting correctly describes the intentional failure
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.report-smoke.outputs.result }}
          PASSED: ${{ steps.report-smoke.outputs.passed }}
          REPORTING: ${{ steps.report-smoke.outputs.reporting-result }}
          PUBLICATION: ${{ steps.report-smoke.outputs.publication-result }}
        run: |-
          test "$RESULT" = failure
          test "$PASSED" = false
          test "$REPORTING" = success
          test "$PUBLICATION" = skipped

      - id: cache
        name: Restore selected tool caches
        uses: ./composite/setup-cache
        with:
          tools: trivy
          trivy-cache-path: ${{ runner.temp }}/tars-actions/trivy
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}
          s3-region: ${{ secrets.S3_REGION }}
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - id: verify-backend
        name: Require S3 storage on the enterprise runner
        env:
          BACKEND: ${{ steps.cache.outputs.backend }}
        run: test "$BACKEND" = s3

      - id: devenv
        name: Prepare the selected environment
        uses: ./composite/setup-devenv

      - id: nix
        name: Ensure Nix is available
        uses: ./composite/setup-nix

      - id: trivy
        name: Validate Trivy in the selected environment
        uses: ./composite/setup-trivy

      - id: validate
        name: Validate on the enterprise runner
        shell: devenv --no-tui shell --quiet -- bash --noprofile --norc -e -o pipefail {0}
        run: |-
          tact validate
          tact run
          tact check metadata
          prek run --all-files

      - id: emulation-cache
        name: Configure public cache for the emulation fixture
        uses: ./composite/setup-nix-cache
        with:
          cachix-name: devenv
          cachix-skip-push: "true"

      - id: emulation
        name: Validate preconfigured foreign-system execution
        uses: ./composite/run-devenv
        with:
          run: |-
            native=$(nix eval --impure --raw --expr builtins.currentSystem)
            case "$native" in
              x86_64-linux) foreign=aarch64-linux ;;
              aarch64-linux) foreign=x86_64-linux ;;
              *) exit 1 ;;
            esac
            configuration=$(nix show-config)
            while IFS= read -r line; do
              if [[ $line == 'extra-platforms = '* && " ${line#*= } " == *" $foreign "* ]]; then
                tact integration environments --system "$foreign"
                exit 0
              fi
            done <<< "$configuration"
            echo "Runner has no preconfigured $foreign support; emulation integration skipped."

      - id: test
        name: Devenv checks
        run: devenv --no-tui test

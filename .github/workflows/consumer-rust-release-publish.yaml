---
name: "Consumer: Rust Release Publish"
on:
  workflow_call:
    inputs:
      lfs:
        description: Fetch Git LFS files during consumer checkout.
        type: boolean
        default: false
      secretspec-profile:
        description: Optional SecretSpec profile override.
        type: string
        default: ""
      dependency-owner:
        description: Dependency App installation owner; empty uses the consumer repository owner.
        type: string
        default: ""
      dependency-repositories:
        description: JSON array of named private dependency repositories in the selected owner.
        type: string
        default: "[]"
      commit-sha:
        description: Full default-branch commit SHA from the triggering push.
        required: true
        type: string
      runs-on:
        description: JSON runner label, label array, or group/labels object.
        type: string
        default: ""
      runner-architecture:
        description: Requested job architecture, AMD64 or ARM64; ARM64 environments require aarch64-linux.
        type: string
        default: AMD64
      system:
        description: Optional x86_64-linux or aarch64-linux execution system.
        type: string
        default: ""
      type:
        description: Consumer environment type, devenv or flakes.
        type: string
        default: devenv
      flake-shell:
        description: Flake devShell selector.
        type: string
        default: .#default
      devenv-installable:
        description: Optional pinned native devenv CLI installable.
        type: string
        default: ""
      artifact-run-id:
        description: Source run containing the declared release artifacts.
        type: string
        default: ${{ github.run_id }}
      release-manifest-artifact:
        description: Artifact containing release-manifest.json.
        type: string
        default: release-manifest
    secrets:
      dependency-app-id:
        description: Optional read-only dependency App ID.
        required: false
      dependency-app-private-key:
        description: Optional dependency App private key, separate from publication credentials.
        required: false
      dependency-token:
        description: Optional existing dependency read token.
        required: false
    outputs:
      release-url:
        description: Published GitHub release.
        value: ${{ jobs.release.outputs.release-url }}
      tag:
        description: Immutable version tag.
        value: ${{ jobs.release.outputs.tag }}
      version:
        description: Published Cargo version.
        value: ${{ jobs.release.outputs.version }}
permissions:
  contents: write
  pull-requests: read
  actions: read
env:
  CI: "true"
  SECRETSPEC_PROVIDER: env
  SECRETSPEC_REASON: rust-release
defaults:
  run:
    shell: bash
jobs:
  # -------------------------------------------------
  # Publish the Consumer Rust Release
  # -------------------------------------------------
  release:
    name: Publish Rust Release
    runs-on:
      ${{ fromJSON(inputs.runs-on || (vars.TARS_CLOUD_RUNNER_TYPE == 'self-hosted' && ((inputs.runner-architecture ==
      'ARM64' && (vars.TARS_CLOUD_RUNNER_ARM64 || '["self-hosted","linux","ARM64"]')) || vars.TARS_CLOUD_RUNNER_AMD64 ||
      '["self-hosted","linux","x64"]')) || (inputs.runner-architecture == 'ARM64' && '"ubuntu-24.04-arm"' ||
      '"ubuntu-24.04"')) }}
    timeout-minutes: 60
    outputs:
      release-url: ${{ steps.release.outputs.release-url }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: trigger
        name: Validate the Default-Branch Release Trigger
        env:
          RELEASE_COMMIT: ${{ inputs.commit-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! $RELEASE_COMMIT =~ ^[a-fA-F0-9]{40}$ ||
            $RELEASE_COMMIT != "$GITHUB_SHA" ||
            $GITHUB_REF != "refs/heads/$DEFAULT_BRANCH" ||
            ($GITHUB_EVENT_NAME != push && $GITHUB_EVENT_NAME != workflow_dispatch) ]]; then
            printf '::error::Run Rust release workflows for the exact default-branch push commit.\n'
            exit 1
          fi

      - id: validate_runner
        name: Validate Runner Configuration
        shell: bash
        env:
          RUNNER_TYPE: ${{ vars.TARS_CLOUD_RUNNER_TYPE }}
          RUNNER_ARCHITECTURE: ${{ inputs.runner-architecture }}
        run: |
          case "$RUNNER_TYPE" in
            ''|saas|self-hosted) ;;
            *) echo '::error::TARS_CLOUD_RUNNER_TYPE must be empty, saas or self-hosted.'; exit 1 ;;
          esac
          case "$RUNNER_ARCHITECTURE" in
            AMD64|ARM64) ;;
            *) echo '::error::runner-architecture must be AMD64 or ARM64.'; exit 1 ;;
          esac

      - id: checkout
        name: Check Out the Exact Consumer Commit and Release History
        uses: $/composite/setup-consumer/scripts/checkout
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0
          lfs: ${{ inputs.lfs }}
          secretspec-profile: ${{ inputs.secretspec-profile }}
          dependency-owner: ${{ inputs.dependency-owner || github.repository_owner }}
          dependency-repositories: ${{ inputs.dependency-repositories }}
          app-id: ${{ secrets.dependency-app-id }}
          app-private-key: ${{ secrets.dependency-app-private-key }}
          dependency-token: ${{ secrets.dependency-token }}

      - id: release
        name: Publish the Rust Release
        uses: $/composite/release-rust
        with:
          dependency-token: ${{ steps.checkout.outputs.dependency-token }}
          secretspec-profile: ${{ inputs.secretspec-profile }}
          command: publish
          commit-sha: ${{ inputs.commit-sha }}
          type: ${{ inputs.type }}
          system: ${{ inputs.system || (inputs.runner-architecture == 'ARM64' && 'aarch64-linux') || '' }}
          flake-shell: ${{ inputs.flake-shell }}
          devenv-installable: ${{ inputs.devenv-installable }}
          github-token: ${{ github.token }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          release-manifest-artifact: ${{ inputs.release-manifest-artifact }}
